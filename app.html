<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Search — Provenance Tracker</title>
<link rel="icon" href="assets/img/favicon.svg"/>
<link rel="stylesheet" href="assets/css/design-system.css"/>
<link rel="stylesheet" href="assets/css/pages.css"/>
</head><body>

<nav class="nav">
  <a href="index.html">Home</a>
  <a href="app.html" class="active">App</a>
  <a href="about.html">About</a>
</nav>

<main class="glass-card">
  <section style="padding:32px 40px 12px;">
    <h2 style="font-size:24px;margin-bottom:8px;">Search Proteins</h2>
    <p>Enter a UniProt accession (e.g. <code>P12345</code>) or a keyword.</p>
  </section>

  <div class="search-bar">
    <input id="q" type="text" placeholder="P12345 or 'kinase'"/>
    <button class="btn" id="go">Search</button>
  </div>

  <section class="results" id="out">
    <div class="glass-field result-card">
      <h4>Waiting for input…</h4>
      <small>Results will appear here.</small>
    </div>
  </section>
</main>

<script src="assets/js/bubbles.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/api.js"></script>
<script>
const q=document.getElementById('q'),go=document.getElementById('go'),out=document.getElementById('out');
async function run(){
  const t=q.value.trim();if(!t)return;
  out.innerHTML=`<div class="glass-field result-card"><h4>Searching…</h4></div>`;
  try{
    let results;
    if(/^[A-Z0-9]{6,10}$/i.test(t))results=[await BioAPI.fetchProtein(t)];
    else results=await BioAPI.searchProteins(t,10);
    if(!results.length){out.innerHTML=`<div class="glass-field result-card"><h4>No results</h4></div>`;return}
    out.innerHTML=results.map(r=>{
      const acc=r.primaryAccession||'';
      const name=r.proteinDescription?.recommendedName?.fullName?.value||r.uniProtkbId||'';
      const org=r.organism?.scientificName||'';
      return `<div class="glass-field result-card"><h4>${name}</h4><small>${acc} · ${org}</small></div>`;
    }).join('');
  }catch(e){out.innerHTML=`<div class="glass-field result-card"><h4>Error: ${e.message}</h4></div>`}
}
go.addEventListener('click',run);
q.addEventListener('keydown',e=>{if(e.key==='Enter')run()});
</script>
</body></html>
