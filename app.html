<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Search — Provenance Tracker</title>
<link rel="stylesheet" href="assets/css/design-system.css?v=16"/>
<link rel="stylesheet" href="assets/css/pages.css?v=16"/>
<style>
  .evidence-badge{display:inline-block;padding:3px 10px;border-radius:999px;
    font-size:11px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;
    border:1px solid currentColor;margin-left:8px;vertical-align:middle}
  .evidence-dot{display:inline-block;width:10px;height:10px;border-radius:50%;
    margin-right:8px;vertical-align:middle;box-shadow:0 0 8px currentColor}
  .feature-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.08)}
  .feature-row:last-child{border-bottom:none}
  .feature-row.retracted{
    background:rgba(239,68,68,0.12);border-radius:10px;
    padding:10px 12px;margin:4px -12px;border-left:3px solid #ef4444}
  .feature-text{flex:1;font-size:13px;color:rgba(255,255,255,0.9)}
  .feature-meta{font-size:11px;color:rgba(255,255,255,0.6);margin-top:4px}
  .chain-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .chain-header h4{font-size:16px}
  .summary-bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 16px;
    border-bottom:1px solid rgba(255,255,255,0.15);margin-bottom:12px}
  .summary-pill{padding:4px 12px;border-radius:999px;font-size:12px;
    font-weight:600;border:1px solid currentColor}
  .retract-banner{display:flex;align-items:center;gap:12px;padding:14px 16px;
    background:rgba(239,68,68,0.18);border:1px solid #ef4444;border-radius:14px;
    margin-bottom:16px;font-size:13px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.5)}
  .retract-banner .icon{font-size:22px}
  .retract-banner strong{color:#fecaca}
  .retract-tag{display:inline-block;padding:2px 8px;border-radius:6px;
    background:#ef4444;color:#fff;font-size:10px;font-weight:800;
    letter-spacing:0.5px;margin-left:8px;vertical-align:middle}
  .loading-bar{height:3px;background:linear-gradient(90deg,transparent,
    rgba(255,255,255,0.8),transparent);background-size:200% 100%;
    animation:slide 1.2s linear infinite;border-radius:2px;margin:10px 0}
  @keyframes slide{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .prov-section{margin-top:16px;padding-top:14px;
    border-top:1px solid rgba(255,255,255,0.15)}
  .prov-header{display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px}
  .prov-header h5{font-size:13px;letter-spacing:0.4px;
    text-transform:uppercase;color:rgba(255,255,255,0.85)}
  .prov-summary{font-size:12px;color:rgba(255,255,255,0.7);
    margin:6px 0 10px;font-style:italic}
  .prov-tree{margin-top:6px;font-size:13px;line-height:1.5}
  .prov-row{display:flex;align-items:center;gap:10px;padding:4px 6px;
    border-radius:8px}
  .prov-row:hover{background:rgba(255,255,255,0.05)}
  .prov-arrow{color:rgba(255,255,255,0.55);font-size:12px;width:14px}
  .prov-name{color:rgba(255,255,255,0.92)}
  .prov-org{color:rgba(255,255,255,0.55);font-style:italic;margin-left:auto;
    font-size:11px}
  .prov-count{display:inline-block;padding:1px 8px;border-radius:999px;
    font-size:11px;font-weight:700;margin-left:6px;border:1px solid}
  .prov-example{opacity:0.75;font-size:12px}
  .prov-empty{color:rgba(255,255,255,0.6);font-size:12px;padding:10px 0;
    font-style:italic}
  .prov-children{border-left:1px dashed rgba(255,255,255,0.22);
    margin-left:14px;padding-left:6px}

  /* Impact analysis */
  .impact-section{margin-top:16px;padding-top:14px;
    border-top:1px solid rgba(255,255,255,0.15)}
  .impact-title{font-size:13px;letter-spacing:0.4px;text-transform:uppercase;
    color:#fecaca;margin-bottom:10px;font-weight:700}
  .impact-empty{font-size:12px;color:rgba(255,255,255,0.6);font-style:italic}
  .impact-loading{font-size:12px;color:rgba(255,255,255,0.75)}
  .impact-block{padding:12px;border-radius:12px;margin-bottom:10px;
    background:rgba(239,68,68,0.10);border:1px solid rgba(239,68,68,0.5)}
  .impact-pmid{font-size:12px;font-weight:700;color:#fecaca;margin-bottom:4px}
  .impact-tag{background:#ef4444;color:#fff;padding:1px 7px;border-radius:4px;
    font-size:10px;margin-right:6px}
  .impact-paper{font-size:12px;color:rgba(255,255,255,0.85);
    margin-bottom:8px;line-height:1.45}
  .impact-count{font-size:13px;color:#fff;margin:8px 0 10px}
  .impact-count strong{color:#fecaca;font-size:16px}
  .impact-list{display:flex;flex-direction:column;gap:4px}
  .impact-protein{display:flex;gap:8px;align-items:baseline;font-size:12px;
    padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.08)}
  .impact-protein:last-child{border-bottom:none}
  .impact-protein a{color:#fbcfe8;text-decoration:none;font-weight:700;
    font-family:ui-monospace,monospace;min-width:70px}
  .impact-protein a:hover{text-decoration:underline}
  .impact-name{color:rgba(255,255,255,0.85);flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .impact-protein small{color:rgba(255,255,255,0.5);font-style:italic;
    font-size:11px}
  .impact-more{font-size:11px;color:rgba(255,255,255,0.6);font-style:italic;
    padding-top:6px}
  .impact-total{font-size:14px;color:#fff;padding:12px 0 4px;
    text-align:center;font-weight:600}
  .impact-total strong{color:#fecaca;font-size:20px}
</style>
</head><body>

<nav class="nav">
  <a href="index.html">Home</a>
  <a href="app.html" class="active">App</a>
  <a href="about.html">About</a>
</nav>

<main class="glass-card">
  <section style="padding:32px 40px 12px;">
    <h2 style="font-size:24px;margin-bottom:8px;">Search Proteins</h2>
    <p>Enter a UniProt accession (e.g. <code>P12345</code>) or a keyword.</p>
  </section>

  <div class="search-bar">
    <input id="q" type="text" placeholder="P12345 or 'kinase'"/>
    <button class="btn" id="go">Search</button>
  </div>

  <section class="results" id="out">
    <div class="glass-field result-card">
      <h4>Waiting for input…</h4>
      <small>Results will appear here.</small>
    </div>
  </section>
</main>

<script src="assets/js/config.js?v=16"></script>
<script src="assets/js/bubbles.js?v=16"></script>
<script src="assets/js/ui.js?v=16"></script>
<script src="assets/js/api.js?v=16"></script>
<script src="assets/js/evidence.js?v=16"></script>
<script src="assets/js/retraction.js?v=16"></script>
<script src="assets/js/provenance.js?v=16"></script>
<script src="assets/js/impact.js?v=16"></script>

<script>
(function () {
  "use strict";
  var q   = document.getElementById("q");
  var go  = document.getElementById("go");
  var out = document.getElementById("out");

  function looksLikeAccession(s) {
    return /^[A-Z][A-Z0-9]{5,9}$/i.test(s) && /\d/.test(s);
  }

  function renderFeature(feature, retractions) {
    var c = window.Evidence.classifyFeature(feature);
    var desc = feature.description || feature.type || "Feature";
    var positions = "";
    if (feature.location && feature.location.start && feature.location.end) {
      positions = feature.location.start.value + "–" + feature.location.end.value;
    }
    var pmids = window.Retraction.extractPmids(feature);
    var hit = pmids.find(function (p) {
      return retractions[p] && retractions[p].retracted;
    });
    var sources = (feature.evidences || [])
      .map(function (e) { return e.source; })
      .filter(Boolean).slice(0, 3).join(", ");
    var tag = hit ? '<span class="retract-tag">⚠ RETRACTED</span>' : '';
    return (
      '<div class="feature-row' + (hit ? ' retracted' : '') + '">' +
        '<span class="evidence-dot" style="color:' + c.color +
          ';background:' + c.color + '"></span>' +
        '<div class="feature-text"><div>' + desc +
          '<span class="evidence-badge" style="color:' + c.color + '">' +
            c.label + '</span>' + tag + '</div>' +
          '<div class="feature-meta">' +
            (positions ? "pos " + positions + " · " : "") +
            (sources || "no source") + '</div>' +
        '</div></div>'
    );
  }

  function summarize(features) {
    var tally = { high: 0, medium: 0, low: 0, very_low: 0, unknown: 0 };
    features.forEach(function (f) {
      var c = window.Evidence.classifyFeature(f);
      tally[c.tier] = (tally[c.tier] || 0) + 1;
    });
    return tally;
  }

  function renderProtein(r, retractions) {
    var acc  = r.primaryAccession || "";
    var name = (r.proteinDescription &&
                r.proteinDescription.recommendedName &&
                r.proteinDescription.recommendedName.fullName &&
                r.proteinDescription.recommendedName.fullName.value) ||
               r.uniProtkbId || "Unknown";
    var org = (r.organism && r.organism.scientificName) || "";
    var features = (r.features || []).slice(0, 200);
    var tally = summarize(features);
    var colors = { high: "#22c55e", medium: "#eab308", low: "#f97316",
                   very_low: "#ef4444", unknown: "#9ca3af" };
    var pills = Object.keys(tally).filter(function (k) { return tally[k] > 0; })
      .map(function (tier) {
        return '<span class="summary-pill" style="color:' + colors[tier] + '">' +
               tally[tier] + ' ' + tier + '</span>';
      }).join("");

    var retractedCount = 0;
    features.forEach(function (f) {
      var pmids = window.Retraction.extractPmids(f);
      if (pmids.some(function (p) {
        return retractions[p] && retractions[p].retracted;
      })) retractedCount++;
    });
    var banner = retractedCount > 0
      ? '<div class="retract-banner"><span class="icon">⚠️</span>' +
        '<div><strong>' + retractedCount + ' annotation' +
        (retractedCount > 1 ? 's' : '') +
        '</strong> rely on retracted papers.</div></div>'
      : "";

    var rows = features.length
      ? features.slice(0, 25).map(function (f) {
          return renderFeature(f, retractions);
        }).join("")
      : '<div class="feature-meta">This UniProt entry has no features.</div>';

    var provId = "prov-" + acc.replace(/[^A-Za-z0-9]/g, "_");
    var impactId = "impact-" + acc.replace(/[^A-Za-z0-9]/g, "_");

    return (
      '<div class="glass-field result-card" style="margin-bottom:18px" data-acc="' + acc + '">' +
        '<div class="chain-header">' +
          '<h4>' + name + '</h4>' +
          '<small>' + acc + ' · ' + org + '</small>' +
        '</div>' +
        banner +
        (pills ? '<div class="summary-bar">' + pills + '</div>' : "") +
        '<div>' + rows + '</div>' +
        '<div class="prov-section">' +
          '<div class="prov-header"><h5>🌳 Evidence Hierarchy</h5></div>' +
          '<div id="' + provId + '" class="prov-tree"></div>' +
        '</div>' +
        '<div class="impact-section">' +
          '<div id="' + impactId + '"></div>' +
        '</div>' +
      '</div>'
    );
  }

  function collectAllPmids(results) {
    var set = {};
    results.forEach(function (r) {
      (r.features || []).forEach(function (f) {
        window.Retraction.extractPmids(f).forEach(function (p) { set[p] = true; });
      });
    });
    return Object.keys(set);
  }

  function run() {
    var t = q.value.trim();
    if (!t) return;
    out.innerHTML = '<div class="glass-field result-card"><h4>Searching…</h4>' +
                    '<div class="loading-bar"></div></div>';
    var p;
    if (looksLikeAccession(t)) {
      p = window.BioAPI.fetchProtein(t).then(function (r) { return [r]; });
    } else {
      p = window.BioAPI.searchProteins(t, 5);
    }
    p.then(function (results) {
      if (!results || !results.length) {
        out.innerHTML = '<div class="glass-field result-card"><h4>No results</h4></div>';
        return;
      }
      out.innerHTML = '<div class="glass-field result-card"><h4>Checking sources…</h4>' +
                      '<div class="loading-bar"></div></div>';
      var pmids = collectAllPmids(results);
      return window.Retraction.checkPmids(pmids).then(function (retractions) {
        out.innerHTML = results.map(function (r) {
          return renderProtein(r, retractions);
        }).join("");
        // Auto-build hierarchies
        results.forEach(function (r) {
          var acc = r.primaryAccession || "";
          var id = "prov-" + acc.replace(/[^A-Za-z0-9]/g, "_");
          var box = document.getElementById(id);
          if (box) window.Provenance.renderForData(r, box);
        });
        // Run impact analysis
        results.forEach(function (r) {
          var acc = r.primaryAccession || "";
          var impactId = "impact-" + acc.replace(/[^A-Za-z0-9]/g, "_");
          var ibox = document.getElementById(impactId);
          if (ibox) window.Impact.analyze(r, retractions, ibox);
        });
      });
    }).catch(function (e) {
      console.error(e);
      out.innerHTML = '<div class="glass-field result-card"><h4>Error: ' +
                      e.message + '</h4></div>';
    });
  }

  var params = new URLSearchParams(window.location.search);
  if (params.get("q")) {
    q.value = params.get("q");
    setTimeout(run, 100);
  }
  go.addEventListener("click", run);
  q.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
  console.log("[app] ready v15 (impact analysis)");
})();
</script>
</body></html>
