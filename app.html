<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Search — Provenance Tracker</title>
<link rel="icon" href="assets/img/favicon.svg"/>
<link rel="stylesheet" href="assets/css/design-system.css?v=18"/>
<link rel="stylesheet" href="assets/css/pages.css?v=18"/>
<style>
  /* ============ Typography refinements ============ */
  body { letter-spacing: -0.005em; }

  /* ============ Evidence badge — refined ============ */
  .evidence-badge{
    display:inline-block;
    padding:3px 10px;
    border-radius:999px;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    border:1px solid currentColor;
    margin-left:8px;
    vertical-align:middle;
    background:rgba(255,255,255,0.04);
  }
  .evidence-dot{
    display:inline-block;
    width:9px;height:9px;
    border-radius:50%;
    margin-right:10px;
    vertical-align:middle;
    box-shadow:0 0 10px currentColor;
    flex-shrink:0;
    margin-top:5px;
  }

  /* ============ Feature rows — softer ============ */
  .feature-row{
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:11px 10px;
    border-bottom:1px solid rgba(255,255,255,0.05);
    border-radius:8px;
    transition:background 0.18s ease;
  }
  .feature-row:hover{
    background:rgba(255,255,255,0.035);
  }
  .feature-row:last-child{border-bottom:none}
  .feature-row.retracted{
    background:rgba(239,68,68,0.10);
    padding:11px 12px;
    margin:6px -12px;
    border-left:3px solid #ef4444;
    border-radius:10px;
  }
  .feature-row.retracted:hover{
    background:rgba(239,68,68,0.14);
  }
  .feature-text{
    flex:1;
    font-size:13.5px;
    color:rgba(255,255,255,0.92);
    line-height:1.45;
  }
  .feature-meta{
    font-size:11.5px;
    color:rgba(255,255,255,0.58);
    margin-top:5px;
    letter-spacing:0.1px;
  }

  /* ============ Card header ============ */
  .chain-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .chain-header h4{
    font-size:16.5px;
    letter-spacing:-0.2px;
    line-height:1.3;
    margin-bottom:3px;
  }
  .chain-header small{
    font-size:12px;
    color:rgba(255,255,255,0.6);
    letter-spacing:0.1px;
  }
  .chain-actions{display:flex;gap:8px;flex-shrink:0}

  /* ============ PDF button — refined ============ */
  .pdf-btn{
    font-size:11.5px;
    padding:7px 14px;
    border-radius:9px;
    background:rgba(239,68,68,0.16);
    border:1px solid rgba(239,68,68,0.55);
    color:#fecaca;
    cursor:pointer;
    font-weight:600;
    letter-spacing:0.2px;
    transition:all 0.18s ease;
    font-family:inherit;
  }
  .pdf-btn:hover{
    background:rgba(239,68,68,0.28);
    transform:translateY(-1px);
    box-shadow:0 4px 14px rgba(239,68,68,0.28);
  }
  .pdf-btn:disabled{opacity:0.5;cursor:wait;transform:none}

  /* ============ Summary pills ============ */
  .summary-bar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    padding:12px 0 16px;
    border-bottom:1px solid rgba(255,255,255,0.10);
    margin-bottom:16px;
  }
  .summary-pill{
    padding:4px 12px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.2px;
    border:1px solid currentColor;
    background:rgba(255,255,255,0.03);
  }

  /* ============ Retraction banner ============ */
  .retract-banner{
    display:flex;align-items:center;gap:12px;
    padding:13px 16px;
    background:rgba(239,68,68,0.14);
    border:1px solid rgba(239,68,68,0.55);
    border-left:3px solid #ef4444;
    border-radius:12px;
    margin-bottom:18px;
    font-size:13px;
    color:#fff;
    letter-spacing:0.1px;
    line-height:1.5;
  }
  .retract-banner .icon{font-size:20px;flex-shrink:0}
  .retract-banner strong{color:#fecaca}
  .retract-tag{
    display:inline-block;
    padding:2px 8px;
    border-radius:5px;
    background:#ef4444;
    color:#fff;
    font-size:9.5px;
    font-weight:800;
    letter-spacing:0.6px;
    margin-left:8px;
    vertical-align:middle;
  }

  /* ============ Loading bar ============ */
  .loading-bar{
    height:2px;
    background:linear-gradient(90deg,transparent,
      rgba(255,255,255,0.85),transparent);
    background-size:200% 100%;
    animation:slide 1.2s linear infinite;
    border-radius:2px;
    margin:12px 0 4px;
  }
  @keyframes slide{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* ============ Sections — with accent bars ============ */
  .section{
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid rgba(255,255,255,0.10);
  }
  .section h5{
    font-size:11.5px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:rgba(255,255,255,0.92);
    margin-bottom:12px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section h5::before{
    content:"";
    display:inline-block;
    width:3px;
    height:14px;
    border-radius:2px;
    background:linear-gradient(180deg,#a78bfa,#ec4899);
    box-shadow:0 0 8px rgba(236,72,153,0.5);
  }

  /* ============ 3D viewer ============ */
  .mol-canvas{
    border-radius:12px;
    background:radial-gradient(circle at 50% 40%,
      rgba(99,102,241,0.10),rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.12);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .mol-loading,.mol-empty{
    font-size:12px;
    color:rgba(255,255,255,0.65);
    padding:24px;
    text-align:center;
    font-style:italic;
    letter-spacing:0.2px;
  }
  .mol-meta{
    font-size:11.5px;
    color:rgba(255,255,255,0.6);
    margin-top:10px;
    text-align:center;
    letter-spacing:0.1px;
  }
  .mol-meta a{
    color:#fbcfe8;
    text-decoration:none;
    border-bottom:1px dotted rgba(251,207,232,0.4);
  }
  .mol-meta a:hover{
    border-bottom-style:solid;
    border-bottom-color:#fbcfe8;
  }

  /* ============ Charts grid — refined container ============ */
  .charts-grid{
    display:grid;
    gap:16px;
    margin-top:12px;
  }
  @media (min-width:760px){.charts-grid{grid-template-columns:1fr 1fr}}

  .chart-box{
    padding:14px 14px 10px;
    border-radius:14px;
    background:rgba(255,255,255,0.035);
    border:1px solid rgba(255,255,255,0.13);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.12);
    height:290px;
    position:relative;
    overflow:hidden;
    animation:chartFade 0.5s ease-out;
  }
  @keyframes chartFade{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
  }
  .chart-box canvas{max-height:250px !important}

  /* ============ Provenance tree ============ */
  .prov-summary{
    font-size:12px;
    color:rgba(255,255,255,0.65);
    margin:6px 0 12px;
    font-style:italic;
    letter-spacing:0.1px;
  }
  .prov-tree{margin-top:8px;font-size:13px;line-height:1.55}
  .prov-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:5px 8px;
    border-radius:8px;
    transition:background 0.15s ease;
  }
  .prov-row:hover{background:rgba(255,255,255,0.045)}
  .prov-arrow{
    color:rgba(255,255,255,0.5);
    font-size:12px;
    width:14px;
    flex-shrink:0;
  }
  .prov-name{
    color:rgba(255,255,255,0.93);
    letter-spacing:0.05px;
  }
  .prov-org{
    color:rgba(255,255,255,0.5);
    font-style:italic;
    margin-left:auto;
    font-size:11px;
    letter-spacing:0.1px;
  }
  .prov-count{
    display:inline-block;
    padding:1px 9px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    margin-left:6px;
    border:1px solid;
  }
  .prov-example{opacity:0.7;font-size:12px}
  .prov-empty{
    color:rgba(255,255,255,0.55);
    font-size:12px;
    padding:14px 0;
    font-style:italic;
    letter-spacing:0.15px;
  }
  .prov-children{
    border-left:1px dashed rgba(255,255,255,0.18);
    margin-left:14px;
    padding-left:8px;
  }

  /* ============ Impact analysis ============ */
  .impact-title{
    font-size:11.5px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:#fecaca;
    margin-bottom:12px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .impact-title::before{
    content:"";
    display:inline-block;
    width:3px;
    height:14px;
    border-radius:2px;
    background:linear-gradient(180deg,#f87171,#dc2626);
    box-shadow:0 0 8px rgba(220,38,38,0.5);
  }
  .impact-empty{
    font-size:12px;
    color:rgba(255,255,255,0.55);
    font-style:italic;
    letter-spacing:0.15px;
  }
  .impact-loading{font-size:12px;color:rgba(255,255,255,0.7)}

  .impact-block{
    padding:14px;
    border-radius:12px;
    margin-bottom:12px;
    background:rgba(239,68,68,0.08);
    border:1px solid rgba(239,68,68,0.4);
    border-left:3px solid #ef4444;
  }
  .impact-pmid{
    font-size:12px;
    font-weight:700;
    color:#fecaca;
    margin-bottom:6px;
    letter-spacing:0.2px;
  }
  .impact-tag{
    background:#ef4444;
    color:#fff;
    padding:2px 8px;
    border-radius:5px;
    font-size:9.5px;
    font-weight:800;
    letter-spacing:0.5px;
    margin-right:8px;
  }
  .impact-paper{
    font-size:12px;
    color:rgba(255,255,255,0.82);
    margin-bottom:10px;
    line-height:1.55;
    font-style:italic;
  }
  .impact-count{
    font-size:13px;
    color:#fff;
    margin:10px 0 12px;
    letter-spacing:0.1px;
  }
  .impact-count strong{color:#fecaca;font-size:17px}

  .impact-protein{
    display:flex;
    gap:10px;
    align-items:baseline;
    font-size:12px;
    padding:5px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .impact-protein:last-child{border-bottom:none}
  .impact-protein a{
    color:#fbcfe8;
    text-decoration:none;
    font-weight:700;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    min-width:72px;
    letter-spacing:0;
  }
  .impact-protein a:hover{
    text-decoration:underline;
    text-decoration-color:#fbcfe8;
  }
  .impact-protein small{
    color:rgba(255,255,255,0.45);
    font-style:italic;
    font-size:11px;
    margin-left:auto;
  }
  .impact-more{
    font-size:11px;
    color:rgba(255,255,255,0.55);
    font-style:italic;
    padding-top:8px;
  }
  .impact-total{
    font-size:14px;
    color:#fff;
    padding:14px 0 4px;
    text-align:center;
    font-weight:600;
    letter-spacing:0.1px;
  }
  .impact-total strong{color:#fecaca;font-size:20px;letter-spacing:-0.3px}

  /* ============ Search bar refinement ============ */
  .search-bar input{
    letter-spacing:0.05px;
    font-size:15px;
  }

  /* ============ Mobile tweaks ============ */
  @media (max-width:600px){
    .section{margin-top:18px;padding-top:14px}
    .chart-box{height:250px;padding:12px 12px 8px}
    .chart-box canvas{max-height:210px !important}
    .chain-header h4{font-size:15.5px}
    .feature-row{padding:10px 8px}
  }
</style>
</head><body>

<nav class="nav">
  <a href="index.html">Home</a>
  <a href="app.html" class="active">App</a>

</nav>

<main class="glass-card">
  <section style="padding:32px 40px 12px;">
    <h2 style="font-size:24px;margin-bottom:8px;letter-spacing:-0.3px;">Search Proteins</h2>
    <p>Evidence · retractions · 3D structure · reliability charts · PDF export.</p>
  </section>

  <div class="search-bar">
    <input id="q" type="text" placeholder="P12345 or 'kinase'"/>
    <button class="btn" id="go">Search</button>
  </div>

  <section class="results" id="out">
    <div class="glass-field result-card">
      <h4>Waiting for input…</h4>
      <small>Results will appear here.</small>
    </div>
  </section>
</main>

<!-- libraries -->
<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- theme patches (must come before charts.js) -->
<script src="assets/js/patches.js?v=18"></script>

<!-- project scripts -->
<script src="assets/js/config.js?v=18"></script>
<script src="assets/js/bubbles.js?v=18"></script>
<script src="assets/js/ui.js?v=18"></script>
<script src="assets/js/api.js?v=18"></script>
<script src="assets/js/evidence.js?v=18"></script>
<script src="assets/js/retraction.js?v=18"></script>
<script src="assets/js/provenance.js?v=18"></script>
<script src="assets/js/impact.js?v=18"></script>
<script src="assets/js/structure.js?v=18"></script>
<script src="assets/js/charts.js?v=18"></script>
<script src="assets/js/pdf.js?v=18"></script>

<script>
(function () {
  "use strict";
  var q = document.getElementById("q");
  var go = document.getElementById("go");
  var out = document.getElementById("out");

  function looksLikeAccession(s) {
    return /^[A-Z][A-Z0-9]{5,9}$/i.test(s) && /\d/.test(s);
  }
  function safeId(acc) { return acc.replace(/[^A-Za-z0-9]/g, "_"); }

  function renderFeature(feature, retractions) {
    var c = window.Evidence.classifyFeature(feature);
    var desc = feature.description || feature.type || "Feature";
    var positions = "";
    if (feature.location && feature.location.start && feature.location.end) {
      positions = feature.location.start.value + "–" + feature.location.end.value;
    }
    var pmids = window.Retraction.extractPmids(feature);
    var hit = pmids.find(function (p) {
      return retractions[p] && retractions[p].retracted;
    });
    var sources = (feature.evidences || [])
      .map(function (e) { return e.source; })
      .filter(Boolean).slice(0, 3).join(", ");
    var tag = hit ? '<span class="retract-tag">⚠ RETRACTED</span>' : '';
    return (
      '<div class="feature-row' + (hit ? ' retracted' : '') + '">' +
        '<span class="evidence-dot" style="color:' + c.color +
          ';background:' + c.color + '"></span>' +
        '<div class="feature-text"><div>' + desc +
          '<span class="evidence-badge" style="color:' + c.color + '">' +
            c.label + '</span>' + tag + '</div>' +
          '<div class="feature-meta">' +
            (positions ? "pos " + positions + " · " : "") +
            (sources || "no source") + '</div>' +
        '</div></div>'
    );
  }

  function summarize(features) {
    var tally = { high:0, medium:0, low:0, very_low:0, unknown:0 };
    features.forEach(function (f) {
      var c = window.Evidence.classifyFeature(f);
      tally[c.tier] = (tally[c.tier] || 0) + 1;
    });
    return tally;
  }

  function renderProtein(r, retractions) {
    var acc = r.primaryAccession || "";
    var sid = safeId(acc);
    var name = (r.proteinDescription &&
                r.proteinDescription.recommendedName &&
                r.proteinDescription.recommendedName.fullName &&
                r.proteinDescription.recommendedName.fullName.value) ||
               r.uniProtkbId || "Unknown";
    var org = (r.organism && r.organism.scientificName) || "";
    var features = (r.features || []).slice(0, 200);
    var tally = summarize(features);
    var colors = { high:"#22c55e", medium:"#eab308", low:"#f97316",
                   very_low:"#ef4444", unknown:"#9ca3af" };
    var pills = Object.keys(tally).filter(function (k) { return tally[k] > 0; })
      .map(function (tier) {
        return '<span class="summary-pill" style="color:' + colors[tier] + '">' +
               tally[tier] + ' ' + tier + '</span>';
      }).join("");

    var retractedCount = 0;
    features.forEach(function (f) {
      var pmids = window.Retraction.extractPmids(f);
      if (pmids.some(function (p) {
        return retractions[p] && retractions[p].retracted;
      })) retractedCount++;
    });
    var banner = retractedCount > 0
      ? '<div class="retract-banner"><span class="icon">⚠️</span>' +
        '<div><strong>' + retractedCount + ' annotation' +
        (retractedCount > 1 ? 's' : '') +
        '</strong> rely on retracted papers.</div></div>'
      : "";

    var rows = features.length
      ? features.slice(0, 25).map(function (f) {
          return renderFeature(f, retractions);
        }).join("")
      : '<div class="feature-meta">No features in this record.</div>';

    return (
      '<div class="glass-field result-card" id="card-' + sid +
        '" style="margin-bottom:18px" data-acc="' + acc + '">' +
        '<div class="chain-header">' +
          '<div><h4>' + name + '</h4><small>' + acc + ' · ' + org + '</small></div>' +
          '<div class="chain-actions">' +
            '<button class="pdf-btn" data-acc="' + acc + '">📄 Export PDF</button>' +
          '</div>' +
        '</div>' +
        banner +
        (pills ? '<div class="summary-bar">' + pills + '</div>' : "") +
        '<div>' + rows + '</div>' +

        '<div class="section">' +
          '<h5>🧬 3D Structure</h5>' +
          '<div id="mol-' + sid + '"></div>' +
        '</div>' +

        '<div class="section">' +
          '<h5>📊 Reliability Charts</h5>' +
          '<div class="charts-grid">' +
            '<div class="chart-box"><canvas id="chart-' + sid + '-donut"></canvas></div>' +
            '<div class="chart-box"><canvas id="chart-' + sid + '-features"></canvas></div>' +
            '<div class="chart-box"><canvas id="chart-' + sid + '-scatter"></canvas></div>' +
            '<div class="chart-box"><canvas id="chart-' + sid + '-timeline"></canvas></div>' +
          '</div>' +
        '</div>' +

        '<div class="section">' +
          '<h5>🌳 Evidence Hierarchy</h5>' +
          '<div id="prov-' + sid + '"></div>' +
        '</div>' +

        '<div class="section">' +
          '<div id="impact-' + sid + '"></div>' +
        '</div>' +
      '</div>'
    );
  }

  function collectAllPmids(results) {
    var set = {};
    results.forEach(function (r) {
      (r.features || []).forEach(function (f) {
        window.Retraction.extractPmids(f).forEach(function (p) { set[p] = true; });
      });
    });
    return Object.keys(set);
  }

  function run() {
    var t = q.value.trim();
    if (!t) return;
    out.innerHTML = '<div class="glass-field result-card"><h4>Searching…</h4>' +
                    '<div class="loading-bar"></div></div>';
    var p;
    if (looksLikeAccession(t)) {
      p = window.BioAPI.fetchProtein(t).then(function (r) { return [r]; });
    } else {
      p = window.BioAPI.searchProteins(t, 5);
    }
    p.then(function (results) {
      if (!results || !results.length) {
        out.innerHTML = '<div class="glass-field result-card"><h4>No results</h4></div>';
        return;
      }
      out.innerHTML = '<div class="glass-field result-card"><h4>Checking sources…</h4>' +
                      '<div class="loading-bar"></div></div>';
      var pmids = collectAllPmids(results);
      return window.Retraction.checkPmids(pmids).then(function (retractions) {
        out.innerHTML = results.map(function (r) {
          return renderProtein(r, retractions);
        }).join("");

        results.forEach(function (r) {
          var acc = r.primaryAccession || "";
          var sid = safeId(acc);
          var features = (r.features || []).slice(0, 200);

          var molBox = document.getElementById("mol-" + sid);
          if (molBox) window.Structure.render(acc, molBox);

          var prefix = "chart-" + sid;
          if (document.getElementById(prefix + "-donut")) {
            window.ReliabilityCharts.renderAll(prefix, features, retractions);
          }

          var provBox = document.getElementById("prov-" + sid);
          if (provBox) window.Provenance.renderForData(r, provBox);

          var impactBox = document.getElementById("impact-" + sid);
          if (impactBox) window.Impact.analyze(r, retractions, impactBox);
        });
      });
    }).catch(function (e) {
      console.error(e);
      out.innerHTML = '<div class="glass-field result-card"><h4>Error: ' +
                      e.message + '</h4></div>';
    });
  }

  document.addEventListener("click", function (e) {
    var btn = e.target.closest(".pdf-btn");
    if (!btn) return;
    var card = btn.closest(".glass-field.result-card");
    if (!card) return;
    var acc = card.getAttribute("data-acc") || "protein";
    window.PDFExport.exportElement(card, acc);
  });

  var params = new URLSearchParams(window.location.search);
  if (params.get("q")) {
    q.value = params.get("q");
    setTimeout(run, 100);
  }
  go.addEventListener("click", run);
  q.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
  console.log("[app] ready v18 — styled");
})();
</script>
</body></html>
