<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Search — BioOrigin</title>
<link rel="icon" href="assets/img/favicon.svg"/>
<link rel="stylesheet" href="assets/css/design-system.css?v=28"/>
<link rel="stylesheet" href="assets/css/pages.css?v=28"/>
<style>
  /* ---------- Horizontal scroll wrapper — desktop layout frozen ---------- */
  .card-scroll{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:12px;
  }
  .collective-card{
    min-width:1180px;
    border-radius:20px;
    padding:24px 28px 30px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.22);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.25),
               0 12px 36px rgba(0,0,0,0.28);
  }
  .collective-header{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:16px;flex-wrap:wrap;margin-bottom:18px;
  }
  .collective-header h2{font-size:22px;letter-spacing:-0.3px;margin-bottom:6px}
  .collective-header .meta{font-size:12.5px;color:rgba(255,255,255,0.62)}
  .collective-actions{display:flex;gap:8px;flex-wrap:wrap}

  .action-btn{
    font-size:12px;padding:9px 16px;border-radius:10px;
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.35);
    color:#fff;cursor:pointer;font-weight:600;
    transition:all 0.18s ease;font-family:inherit;
    min-height:38px;touch-action:manipulation;
  }
  .action-btn:hover,.action-btn:active{
    background:rgba(255,255,255,0.18);transform:translateY(-1px);
  }
  .action-btn.primary{
    background:rgba(239,68,68,0.16);
    border-color:rgba(239,68,68,0.55);color:#fecaca;
  }
  .action-btn.primary:hover,.action-btn.primary:active{
    background:rgba(239,68,68,0.28);
    box-shadow:0 4px 14px rgba(239,68,68,0.28);
  }

  .summary-bar{
    display:flex;gap:8px;flex-wrap:wrap;
    padding:0 0 18px;
    border-bottom:1px solid rgba(255,255,255,0.10);
    margin-bottom:20px;
  }
  .summary-pill{
    padding:5px 14px;border-radius:999px;font-size:12px;
    font-weight:600;letter-spacing:0.2px;
    border:1px solid currentColor;background:rgba(255,255,255,0.03);
  }

  /* Tab strip */
  .tab-strip{
    display:flex;gap:6px;padding:6px;margin-bottom:18px;
    border-radius:12px;background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12);
    overflow-x:auto;scrollbar-width:none;
  }
  .tab-strip::-webkit-scrollbar{display:none}
  .tab-btn{
    flex-shrink:0;padding:10px 18px;border:none;border-radius:9px;
    background:transparent;color:rgba(255,255,255,0.78);
    font-size:13px;font-weight:600;font-family:inherit;
    cursor:pointer;transition:all 0.18s ease;
    min-height:40px;touch-action:manipulation;white-space:nowrap;
  }
  .tab-btn:hover{color:#fff;background:rgba(255,255,255,0.08)}
  .tab-btn.active{
    background:rgba(255,255,255,0.16);color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.25);
  }

  .tab-panel{display:none;animation:fadeIn 0.25s ease}
  .tab-panel.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- CHARTS TAB: 4-chart grid + 3D side-by-side ---------- */
  .charts-layout{
    display:grid;
    grid-template-columns:1fr 1fr 380px;   /* 2 charts wide, 3D on right */
    grid-template-rows:auto auto;
    gap:16px;
    align-items:stretch;
  }
  .chart-box{
    padding:6px 8px 2px;border-radius:14px;
    background:rgba(20,15,45,0.55);
    border:1px solid rgba(255,255,255,0.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.14);
    height:340px;position:relative;overflow:hidden;
  }
  .chart-box > div{width:100%;height:100%;touch-action:manipulation}

  /* 3D panel — spans both rows */
  .view3d-box{
    grid-column:3;
    grid-row:1 / 3;
    border-radius:14px;
    background:radial-gradient(circle at 50% 40%,
      rgba(99,102,241,0.16),rgba(20,15,45,0.55));
    border:1px solid rgba(255,255,255,0.16);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .view3d-box .mol-canvas{width:100%;height:100%;border-radius:12px;overflow:hidden}

  .view3d-title{
    position:absolute;top:12px;left:14px;
    font-size:11px;letter-spacing:0.8px;text-transform:uppercase;
    color:rgba(255,255,255,0.85);font-weight:700;
    display:flex;align-items:center;gap:8px;
    z-index:5;
  }
  .view3d-title::before{
    content:"";display:inline-block;width:3px;height:13px;
    border-radius:2px;
    background:linear-gradient(180deg,#a78bfa,#ec4899);
    box-shadow:0 0 8px rgba(236,72,153,0.5);
  }
  .view3d-switch{
    position:absolute;top:12px;right:14px;
    font-size:10.5px;padding:5px 10px;
    border-radius:999px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.3);
    color:#fff;cursor:pointer;font-weight:600;
    font-family:inherit;z-index:5;
    touch-action:manipulation;
  }
  .view3d-switch:hover{background:rgba(255,255,255,0.22)}

  .mol-loading,.mol-empty{
    font-size:12px;color:rgba(255,255,255,0.7);
    padding:28px;text-align:center;font-style:italic;
  }
  .mol-meta{
    font-size:11px;color:rgba(255,255,255,0.6);
    margin-top:8px;text-align:center;
  }
  .mol-meta a{color:#fbcfe8;text-decoration:none;border-bottom:1px dotted}

  /* Protein list */
  .protein-list{display:grid;gap:10px}
  .protein-item{
    padding:16px 18px;border-radius:12px;
    background:rgba(255,255,255,0.035);
    border:1px solid rgba(255,255,255,0.14);
    display:flex;justify-content:space-between;align-items:center;
    gap:14px;text-decoration:none;color:inherit;
    transition:background 0.18s ease,border-color 0.18s ease;
    cursor:pointer;min-height:68px;
  }
  .protein-item:hover,.protein-item:active{
    background:rgba(255,255,255,0.07);
    border-color:rgba(255,255,255,0.32);
  }
  .protein-item-info{flex:1;min-width:0}
  .protein-item h4{
    font-size:14.5px;margin-bottom:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .protein-item .meta{
    font-size:12px;color:rgba(255,255,255,0.58);
    font-family:ui-monospace,SFMono-Regular,monospace;
  }
  .tier-pills{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;
              justify-content:flex-end;max-width:200px}
  .tier-pill{
    font-size:10px;padding:2px 8px;border-radius:999px;
    font-weight:700;letter-spacing:0.3px;
    border:1px solid currentColor;background:rgba(255,255,255,0.03);
  }

  /* Tree */
  .tree-scroll{
    overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-x pan-y;padding-bottom:10px;
    border-radius:12px;background:rgba(255,255,255,0.02);
    border:1px solid rgba(255,255,255,0.12);
  }
  .tree-loading,.tree-empty{
    font-size:13px;color:rgba(255,255,255,0.6);
    font-style:italic;padding:26px;text-align:center;
  }

  /* Impact */
  .impact-block{
    padding:14px;border-radius:12px;margin-bottom:12px;
    background:rgba(239,68,68,0.08);
    border:1px solid rgba(239,68,68,0.4);
    border-left:3px solid #ef4444;
  }
  .impact-pmid{font-size:13px;font-weight:700;color:#fecaca;margin-bottom:6px}
  .impact-pmid .tag{
    background:#ef4444;color:#fff;padding:2px 8px;border-radius:5px;
    font-size:10px;font-weight:800;margin-right:8px;
  }
  .impact-count{font-size:13px;color:#fff;margin:8px 0}
  .impact-count strong{color:#fecaca;font-size:16px}
  .impact-protein{
    display:flex;gap:10px;align-items:baseline;font-size:12px;
    padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .impact-protein a{
    color:#fbcfe8;text-decoration:none;font-weight:700;
    font-family:ui-monospace,monospace;min-width:72px;
  }
  .impact-protein small{color:rgba(255,255,255,0.5);
                        font-style:italic;margin-left:auto}
  .impact-empty{font-size:13px;color:rgba(255,255,255,0.6);
                font-style:italic;padding:12px 0}

  .loading-bar{
    height:3px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.85),transparent);
    background-size:200% 100%;
    animation:slide 1.2s linear infinite;
    border-radius:2px;margin:14px 0;
  }
  @keyframes slide{0%{background-position:200% 0}100%{background-position:-200% 0}}

  @media (max-width:600px){
    .collective-card{padding:18px 18px 24px;border-radius:16px}
    .collective-header h2{font-size:19px}
  }
</style>
</head><body>

<nav class="nav">
  <a href="index.html">Home</a>
  <a href="app.html" class="active">App</a>
  <a href="about.html">About</a>
</nav>

<main class="glass-card" style="max-width:1500px">
  <section style="padding:32px 40px 12px;">
    <h2 style="font-size:24px;margin-bottom:8px;letter-spacing:-0.3px;">🔬 Search Proteins</h2>
    <p>Collective dashboard · rotating 3D · provenance tree · PDF export.</p>
  </section>

  <div class="search-bar">
    <input id="q" type="text" placeholder="P12345 or 'kinase'"/>
    <button class="btn" id="go">Search</button>
  </div>

  <section class="results" id="out">
    <div class="glass-field result-card" style="display:block;min-width:0">
      <h4>Waiting for input…</h4>
    </div>
  </section>
</main>

<!-- Libraries -->
<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<!-- Project scripts -->
<script src="assets/js/config.js?v=28"></script>
<script src="assets/js/bubbles.js?v=28"></script>
<script src="assets/js/ui.js?v=28"></script>
<script src="assets/js/api.js?v=28"></script>
<script src="assets/js/evidence.js?v=28"></script>
<script src="assets/js/retraction.js?v=28"></script>
<script src="assets/js/impact.js?v=28"></script>
<script src="assets/js/structure.js?v=28"></script>
<script src="assets/js/collective.js?v=28"></script>
<script src="assets/js/tree.js?v=28"></script>
<script src="assets/js/pdf.js?v=28"></script>

<script>
(function () {
  "use strict";
  console.log("[BioOrigin] app booting…");

  var q   = document.getElementById("q");
  var go  = document.getElementById("go");
  var out = document.getElementById("out");
  var currentProteinIndex = 0;

  function ensureLibs() {
    var missing = [];
    if (!window.BioAPI)     missing.push("BioAPI");
    if (!window.Evidence)   missing.push("Evidence");
    if (!window.Retraction) missing.push("Retraction");
    if (missing.length) {
      console.error("[BioOrigin] missing:", missing);
      out.innerHTML =
        '<div class="glass-field result-card" style="display:block;min-width:0">' +
        '<h4>Startup error</h4>' +
        '<div style="font-size:12px;color:rgba(255,255,255,0.7);margin-top:8px">' +
        'Missing: ' + missing.join(", ") +
        '. Hard-refresh.</div></div>';
      return false;
    }
    return true;
  }

  function looksLikeAccession(s) {
    return /^[A-Z][A-Z0-9]{5,9}$/i.test(s) && /\d/.test(s);
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function tally(features) {
    var t = { high:0, medium:0, low:0, very_low:0, unknown:0 };
    (features || []).forEach(function (f) {
      var c = window.Evidence.classifyFeature(f);
      t[c.tier] = (t[c.tier] || 0) + 1;
    });
    return t;
  }

  function renderCollective(proteins, retractions) {
    var total = { high:0, medium:0, low:0, very_low:0, unknown:0 };
    var totalFeatures = 0;
    proteins.forEach(function (p) {
      var t = tally(p.features);
      totalFeatures += (p.features || []).length;
      Object.keys(t).forEach(function (k) { total[k] += t[k]; });
    });

    var colors = { high:"#22c55e", medium:"#eab308", low:"#f97316",
                   very_low:"#ef4444", unknown:"#9ca3af" };
    var pills = Object.keys(total).filter(function (k) { return total[k] > 0; })
      .map(function (tier) {
        return '<span class="summary-pill" style="color:' + colors[tier] + '">' +
               total[tier] + ' ' + tier + '</span>';
      }).join("");

    var queryStr = q.value.trim() || "results";

    var html =
      '<div class="card-scroll">' +
        '<div class="collective-card">' +
          '<div class="collective-header">' +
            '<div>' +
              '<h2>📊 ' + esc(queryStr) + ' — ' + proteins.length +
                ' protein' + (proteins.length !== 1 ? 's' : '') + '</h2>' +
              '<div class="meta">' + totalFeatures + ' annotated features · ' +
                'live from UniProt · ' + new Date().toLocaleTimeString() +
              '</div>' +
            '</div>' +
            '<div class="collective-actions">' +
              '<button class="action-btn primary" id="pdf-collective">📄 Export PDF</button>' +
              '<button class="action-btn" id="json-collective">⬇ JSON</button>' +
            '</div>' +
          '</div>' +
          (pills ? '<div class="summary-bar">' + pills + '</div>' : '') +

          '<div class="tab-strip" id="tabstrip">' +
            '<button class="tab-btn active" data-tab="charts">📈 Charts + 3D</button>' +
            '<button class="tab-btn" data-tab="proteins">🧪 Proteins</button>' +
            '<button class="tab-btn" data-tab="tree">🌳 Tree</button>' +
            '<button class="tab-btn" data-tab="impact">💥 Impact</button>' +
          '</div>' +

          '<div class="tab-panel active" id="tab-charts">' +
            '<div class="charts-layout">' +
              '<div class="chart-box"><div id="collective-donut"></div></div>' +
              '<div class="chart-box"><div id="collective-perprot"></div></div>' +
              '<div class="chart-box"><div id="collective-types"></div></div>' +
              '<div class="chart-box"><div id="collective-positions"></div></div>' +
              '<div class="view3d-box">' +
                '<div class="view3d-title">🧬 3D Structure</div>' +
                '<button class="view3d-switch" id="switch3d">Next protein →</button>' +
                '<div id="collective-3d"></div>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="tab-panel" id="tab-proteins">' +
            '<div class="protein-list">' +
              proteins.map(function (p) {
                var acc = p.primaryAccession;
                var name = (p.proteinDescription &&
                            p.proteinDescription.recommendedName &&
                            p.proteinDescription.recommendedName.fullName &&
                            p.proteinDescription.recommendedName.fullName.value) ||
                           p.uniProtkbId || "Unknown";
                var org = (p.organism && p.organism.scientificName) || "";
                var t = tally(p.features);
                var tierPills = Object.keys(t).filter(function (k) { return t[k] > 0; })
                  .map(function (tier) {
                    return '<span class="tier-pill" style="color:' + colors[tier] + '">' +
                           t[tier] + ' ' + tier + '</span>';
                  }).join("");
                return '<a class="protein-item" href="?q=' + esc(acc) + '">' +
                  '<div class="protein-item-info">' +
                    '<h4>' + esc(name) + '</h4>' +
                    '<div class="meta">' + esc(acc) + ' · ' + esc(org) + '</div>' +
                  '</div>' +
                  '<div class="tier-pills">' + tierPills + '</div>' +
                '</a>';
              }).join("") +
            '</div>' +
          '</div>' +

          '<div class="tab-panel" id="tab-tree">' +
            '<div id="collective-tree"></div>' +
          '</div>' +

          '<div class="tab-panel" id="tab-impact">' +
            '<div id="collective-impact"></div>' +
          '</div>' +
        '</div>' +
      '</div>';

    return html;
  }

  function load3D(proteins, index) {
    var box3d = document.getElementById('collective-3d');
    if (!box3d || !proteins.length) return;
    index = index % proteins.length;
    currentProteinIndex = index;
    var acc = proteins[index].primaryAccession;

    // update the switch button label
    var btn = document.getElementById('switch3d');
    if (btn) {
      var label = proteins.length > 1
        ? ('Next (' + acc + ') →')
        : acc;
      btn.textContent = label;
    }

    if (window.Structure) {
      window.Structure.render(acc, box3d);
    }
  }

  function setupTabs(proteins, retractions) {
    var strip = document.getElementById('tabstrip');
    if (!strip) return;

    strip.addEventListener('click', function (e) {
      var btn = e.target.closest('.tab-btn');
      if (!btn) return;
      var target = btn.getAttribute('data-tab');

      strip.querySelectorAll('.tab-btn').forEach(function (b) {
        b.classList.toggle('active', b === btn);
      });
      document.querySelectorAll('.tab-panel').forEach(function (p) {
        p.classList.toggle('active', p.id === 'tab-' + target);
      });

      if (target === 'tree') {
        var treeBox = document.getElementById('collective-tree');
        if (treeBox && !treeBox.dataset.built && proteins.length) {
          treeBox.dataset.built = "1";
          if (window.Provenance) {
            window.Provenance.renderForAccession(
              proteins[0].primaryAccession, treeBox, 2);
          }
        }
      }

      if (target === 'impact') {
        var impactBox = document.getElementById('collective-impact');
        if (impactBox && !impactBox.dataset.built && proteins.length) {
          impactBox.dataset.built = "1";
          if (window.Impact) {
            window.Impact.analyze(proteins[0], retractions, impactBox);
          }
        }
      }

      if (navigator.vibrate) navigator.vibrate(8);
    });

    // Render charts on the Charts tab immediately
    if (window.Collective) {
      setTimeout(function () { window.Collective.renderAll(proteins); }, 60);
    }

    // Load the 3D viewer immediately on the charts tab
    setTimeout(function () { load3D(proteins, 0); }, 120);

    // Wire the "Next protein" switch button
    var btn = document.getElementById('switch3d');
    if (btn) {
      btn.addEventListener('click', function () {
        load3D(proteins, currentProteinIndex + 1);
        if (navigator.vibrate) navigator.vibrate(8);
      });
    }
  }

  function setupActions(proteins, retractions) {
    var pdfBtn = document.getElementById('pdf-collective');
    if (pdfBtn) {
      pdfBtn.addEventListener('click', function () {
        var btn = this;
        btn.disabled = true;
        btn.textContent = "Rendering…";
        setTimeout(function () {
          try {
            var merged = Object.assign({}, proteins[0], {
              features: proteins.reduce(function (acc, p) {
                return acc.concat((p.features || []).map(function (f) {
                  f._source = p.primaryAccession;
                  return f;
                }));
              }, [])
            });
            window.PDFExport.exportPDF(merged, retractions, null);
          } catch (e) { alert("PDF failed: " + e.message); }
          btn.disabled = false;
          btn.textContent = "📄 Export PDF";
        }, 50);
      });
    }

    var jsonBtn = document.getElementById('json-collective');
    if (jsonBtn) {
      jsonBtn.addEventListener('click', function () {
        var data = {
          query: q.value.trim(),
          generated_at: new Date().toISOString(),
          proteins: proteins.map(function (p) {
            return {
              accession: p.primaryAccession,
              name: (p.proteinDescription && p.proteinDescription.recommendedName &&
                     p.proteinDescription.recommendedName.fullName &&
                     p.proteinDescription.recommendedName.fullName.value) || "",
              organism: (p.organism && p.organism.scientificName) || "",
              feature_count: (p.features || []).length,
              tier_tally: tally(p.features)
            };
          })
        };
        var blob = new Blob([JSON.stringify(data, null, 2)],
                            { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'bioorigin-' +
                     (q.value.trim() || "search").replace(/[^A-Za-z0-9]/g, "_") +
                     '.json';
        a.click();
        URL.revokeObjectURL(url);
      });
    }
  }

  function collectAllPmids(results) {
    var set = {};
    results.forEach(function (r) {
      (r.features || []).forEach(function (f) {
        window.Retraction.extractPmids(f).forEach(function (p) { set[p] = true; });
      });
    });
    return Object.keys(set);
  }

  function run() {
    if (!ensureLibs()) return;
    var t = q.value.trim();
    if (!t) { q.focus(); return; }

    console.log("[BioOrigin] search:", t);

    out.innerHTML =
      '<div class="glass-field result-card" style="display:block;min-width:0">' +
      '<h4>Searching UniProt…</h4><div class="loading-bar"></div></div>';

    var p;
    if (looksLikeAccession(t)) {
      p = window.BioAPI.fetchProtein(t).then(function (r) { return [r]; });
    } else {
      p = window.BioAPI.searchProteins(t, 10);
    }

    p.then(function (results) {
      if (!results || !results.length) {
        out.innerHTML =
          '<div class="glass-field result-card" style="display:block;min-width:0">' +
          '<h4>No results for "' + esc(t) + '"</h4></div>';
        return;
      }
      console.log("[BioOrigin] got", results.length, "proteins");

      out.innerHTML =
        '<div class="glass-field result-card" style="display:block;min-width:0">' +
        '<h4>Checking sources…</h4><div class="loading-bar"></div></div>';

      var pmids = collectAllPmids(results);
      return window.Retraction.checkPmids(pmids).then(function (retractions) {
        console.log("[BioOrigin] rendered");
        out.innerHTML = renderCollective(results, retractions);
        setupTabs(results, retractions);
        setupActions(results, retractions);
      });
    }).catch(function (e) {
      console.error("[BioOrigin] error:", e);
      out.innerHTML =
        '<div class="glass-field result-card" style="display:block;min-width:0">' +
        '<h4>Error: ' + esc(e.message) + '</h4></div>';
    });
  }

  go.addEventListener("click", run);
  q.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); run(); }
  });

  var params = new URLSearchParams(window.location.search);
  if (params.get("q")) {
    q.value = params.get("q");
    setTimeout(run, 150);
  }

  console.log("[BioOrigin] ready v27");
})();
</script>
</body></html>
