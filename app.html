<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Search — Provenance Tracker</title>
<link rel="stylesheet" href="assets/css/design-system.css?v=7"/>
<link rel="stylesheet" href="assets/css/pages.css?v=7"/>
<style>
  .evidence-badge{display:inline-block;padding:3px 10px;border-radius:999px;
    font-size:11px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;
    border:1px solid currentColor;margin-left:8px;vertical-align:middle}
  .evidence-dot{display:inline-block;width:10px;height:10px;border-radius:50%;
    margin-right:8px;vertical-align:middle;box-shadow:0 0 8px currentColor}
  .feature-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.08)}
  .feature-row:last-child{border-bottom:none}
  .feature-text{flex:1;font-size:13px;color:rgba(255,255,255,0.9)}
  .feature-meta{font-size:11px;color:rgba(255,255,255,0.6);margin-top:4px}
  .chain-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .chain-header h4{font-size:16px}
  .summary-bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 16px;
    border-bottom:1px solid rgba(255,255,255,0.15);margin-bottom:12px}
  .summary-pill{padding:4px 12px;border-radius:999px;font-size:12px;
    font-weight:600;border:1px solid currentColor}
</style>
</head><body>

<nav class="nav">
  <a href="index.html">Home</a>
  <a href="app.html" class="active">App</a>
  <a href="about.html">About</a>
</nav>

<main class="glass-card">
  <section style="padding:32px 40px 12px;">
    <h2 style="font-size:24px;margin-bottom:8px;">Search Proteins</h2>
    <p>Enter a UniProt accession (e.g. <code>P12345</code>) or a keyword.</p>
  </section>

  <div class="search-bar">
    <input id="q" type="text" placeholder="P12345 or 'kinase'"/>
    <button class="btn" id="go">Search</button>
  </div>

  <section class="results" id="out">
    <div class="glass-field result-card">
      <h4>Waiting for input…</h4>
      <small>Results will appear here.</small>
    </div>
  </section>
</main>

<!-- load order matters: config → bubbles → ui → api → evidence -->
<script src="assets/js/config.js?v=7"></script>
<script src="assets/js/bubbles.js?v=7"></script>
<script src="assets/js/ui.js?v=7"></script>
<script src="assets/js/api.js?v=7"></script>
<script src="assets/js/evidence.js?v=7"></script>

<script>
(function () {
  "use strict";
  var q = document.getElementById("q");
  var go = document.getElementById("go");
  var out = document.getElementById("out");

  function looksLikeAccession(s) {
    return /^[A-Z][A-Z0-9]{5,9}$/i.test(s) && /\d/.test(s);
  }

  function renderFeature(feature) {
    var codes = window.Evidence.extractCodes(feature);
    if (!codes.length) return "";
    var c = window.Evidence.classifyEvidence(codes);
    var desc = feature.description || feature.type || "Feature";
    var positions = "";
    if (feature.location && feature.location.start && feature.location.end) {
      positions = feature.location.start.value + "–" + feature.location.end.value;
    }
    var sources = (feature.evidences || [])
      .map(function (e) { return e.source; })
      .filter(Boolean).slice(0, 3).join(", ");
    return (
      '<div class="feature-row">' +
        '<span class="evidence-dot" style="color:' + c.color +
          ';background:' + c.color + '"></span>' +
        '<div class="feature-text">' +
          '<div>' + desc +
            '<span class="evidence-badge" style="color:' + c.color + '">' +
              c.label + '</span></div>' +
          '<div class="feature-meta">' +
            (positions ? "pos " + positions + " · " : "") +
            (sources || "no source") +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function summarize(features) {
    var tally = { high: 0, medium: 0, low: 0, very_low: 0, unknown: 0 };
    features.forEach(function (f) {
      var c = window.Evidence.classifyEvidence(window.Evidence.extractCodes(f));
      tally[c.tier] = (tally[c.tier] || 0) + 1;
    });
    return tally;
  }

  function renderProtein(r) {
    var acc = r.primaryAccession || "";
    var name = (r.proteinDescription &&
                r.proteinDescription.recommendedName &&
                r.proteinDescription.recommendedName.fullName &&
                r.proteinDescription.recommendedName.fullName.value) ||
               r.uniProtkbId || "Unknown";
    var org = (r.organism && r.organism.scientificName) || "";
    var features = (r.features || []).filter(function (f) {
      return window.Evidence.extractCodes(f).length > 0;
    });
    var tally = summarize(features);
    var colors = { high: "#22c55e", medium: "#eab308", low: "#f97316",
                   very_low: "#ef4444", unknown: "#9ca3af" };
    var pills = Object.keys(tally).filter(function (k) {
      return tally[k] > 0;
    }).map(function (tier) {
      return '<span class="summary-pill" style="color:' + colors[tier] + '">' +
             tally[tier] + ' ' + tier + '</span>';
    }).join("");
    var rows = features.length
      ? features.map(renderFeature).join("")
      : '<div class="feature-meta">No annotated features with evidence.</div>';
    return (
      '<div class="glass-field result-card" style="margin-bottom:18px">' +
        '<div class="chain-header">' +
          '<h4>' + name + '</h4>' +
          '<small>' + acc + ' · ' + org + '</small>' +
        '</div>' +
        (pills ? '<div class="summary-bar">' + pills + '</div>' : "") +
        '<div>' + rows + '</div>' +
      '</div>'
    );
  }

  function run() {
    var t = q.value.trim();
    if (!t) return;
    if (!window.BioAPI) {
      out.innerHTML = '<div class="glass-field result-card"><h4>' +
                      'Error: BioAPI not loaded — check console</h4></div>';
      return;
    }
    out.innerHTML = '<div class="glass-field result-card"><h4>Searching…</h4></div>';
    var p;
    if (looksLikeAccession(t)) {
      console.log("[app] accession:", t);
      p = window.BioAPI.fetchProtein(t).then(function (r) { return [r]; });
    } else {
      console.log("[app] keyword:", t);
      p = window.BioAPI.searchProteins(t, 5);
    }
    p.then(function (results) {
      if (!results || !results.length) {
        out.innerHTML = '<div class="glass-field result-card"><h4>No results</h4></div>';
        return;
      }
      out.innerHTML = results.map(renderProtein).join("");
    }).catch(function (e) {
      out.innerHTML = '<div class="glass-field result-card"><h4>Error: ' +
                      e.message + '</h4></div>';
    });
  }

  go.addEventListener("click", run);
  q.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
  console.log("[app] ready");
})();
</script>
</body></html>
