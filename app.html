<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Search — Provenance Tracker</title>
<link rel="icon" href="assets/img/favicon.svg"/>
<link rel="stylesheet" href="assets/css/design-system.css"/>
<link rel="stylesheet" href="assets/css/pages.css"/>
<style>
  .evidence-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    border: 1px solid currentColor;
    margin-left: 8px;
    vertical-align: middle;
  }
  .evidence-dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
    box-shadow: 0 0 8px currentColor;
  }
  .feature-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .feature-row:last-child { border-bottom: none; }
  .feature-text { flex: 1; font-size: 13px; color: rgba(255,255,255,0.9); }
  .feature-meta { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 4px; }
  .chain-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .chain-header h4 { font-size: 16px; }
  .summary-bar {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 10px 0 16px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    margin-bottom: 12px;
  }
  .summary-pill {
    padding: 4px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    border: 1px solid currentColor;
  }
</style>
</head><body>

<nav class="nav">
  <a href="index.html">Home</a>
  <a href="app.html" class="active">App</a>
  <a href="about.html">About</a>
</nav>

<main class="glass-card">
  <section style="padding:32px 40px 12px;">
    <h2 style="font-size:24px;margin-bottom:8px;">Search Proteins</h2>
    <p>Enter a UniProt accession (e.g. <code>P12345</code>) or a keyword.</p>
  </section>

  <div class="search-bar">
    <input id="q" type="text" placeholder="P12345 or 'kinase'"/>
    <button class="btn" id="go">Search</button>
  </div>

  <section class="results" id="out">
    <div class="glass-field result-card">
      <h4>Waiting for input…</h4>
      <small>Results will appear here.</small>
    </div>
  </section>
</main>

<script src="assets/js/bubbles.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/evidence.js"></script>
<script>
const q = document.getElementById('q');
const go = document.getElementById('go');
const out = document.getElementById('out');

function renderFeature(feature) {
  const codes = Evidence.extractCodes(feature);
  if (!codes.length) return '';

  const c = Evidence.classifyEvidence(codes);
  const desc = feature.description || feature.type || 'Feature';
  const positions = feature.location
    ? `${feature.location.start?.value ?? '?'}–${feature.location.end?.value ?? '?'}`
    : '';

  const sources = (feature.evidences || [])
    .map(e => e.source)
    .filter(Boolean)
    .slice(0, 3)
    .join(', ');

  return `
    <div class="feature-row">
      <span class="evidence-dot" style="color:${c.color};background:${c.color}"></span>
      <div class="feature-text">
        <div>${desc}
          <span class="evidence-badge" style="color:${c.color}">${c.label}</span>
        </div>
        <div class="feature-meta">
          ${positions ? `pos ${positions} · ` : ''}
          ${sources || 'no source'}
        </div>
      </div>
    </div>`;
}

function summarize(features) {
  const tally = { high: 0, medium: 0, low: 0, very_low: 0, unknown: 0 };
  for (const f of features) {
    const codes = Evidence.extractCodes(f);
    const c = Evidence.classifyEvidence(codes);
    tally[c.tier] = (tally[c.tier] || 0) + 1;
  }
  return tally;
}

function renderProtein(r) {
  const acc = r.primaryAccession || '';
  const name = r.proteinDescription?.recommendedName?.fullName?.value
               || r.uniProtkbId || 'Unknown';
  const org = r.organism?.scientificName || '';

  const features = (r.features || []).filter(f => Evidence.extractCodes(f).length > 0);
  const tally = summarize(features);

  const pills = Object.entries(tally)
    .filter(([, n]) => n > 0)
    .map(([tier, n]) => {
      const colors = { high:'#22c55e', medium:'#eab308', low:'#f97316', very_low:'#ef4444', unknown:'#9ca3af' };
      return `<span class="summary-pill" style="color:${colors[tier]}">${n} ${tier}</span>`;
    }).join('');

  const featureRows = features.length
    ? features.map(renderFeature).join('')
    : '<div class="feature-meta">No annotated features with evidence.</div>';

  return `
    <div class="glass-field result-card" style="margin-bottom:18px">
      <div class="chain-header">
        <h4>${name}</h4>
        <small>${acc} · ${org}</small>
      </div>
      ${pills ? `<div class="summary-bar">${pills}</div>` : ''}
      <div>${featureRows}</div>
    </div>`;
}

async function run() {
  const t = q.value.trim();
  if (!t) return;
  out.innerHTML = `<div class="glass-field result-card"><h4>Searching…</h4></div>`;

  try {
    let results;
    if (/^[A-Z0-9]{6,10}$/i.test(t)) {
      results = [await BioAPI.fetchProtein(t)];
    } else {
      results = await BioAPI.searchProteins(t, 5);
    }

    if (!results.length) {
      out.innerHTML = `<div class="glass-field result-card"><h4>No results</h4></div>`;
      return;
    }

    out.innerHTML = results.map(renderProtein).join('');
  } catch (e) {
    out.innerHTML = `<div class="glass-field result-card"><h4>Error: ${e.message}</h4></div>`;
  }
}

go.addEventListener('click', run);
q.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
</script>
</body></html>
