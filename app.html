<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"/>
<title>Search — Provenance Tracker</title>
<link rel="icon" href="assets/img/favicon.svg"/>
<link rel="stylesheet" href="assets/css/design-system.css?v=24"/>
<link rel="stylesheet" href="assets/css/pages.css?v=24"/>
<style>
  /* ============================================================
     Collective dashboard layout
     ============================================================ */
  .collective-card{
    border-radius:20px;
    padding:22px 24px 28px;
    background:rgba(255,255,255,0.035);
    border:1px solid rgba(255,255,255,0.22);
    backdrop-filter:blur(8px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.22),
               0 10px 30px rgba(0,0,0,0.22);
    margin-bottom:24px;
  }
  .collective-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .collective-header h2{
    font-size:20px;
    letter-spacing:-0.2px;
    margin-bottom:6px;
  }
  .collective-header .meta{
    font-size:12px;
    color:rgba(255,255,255,0.62);
  }
  .collective-actions{display:flex;gap:8px;flex-wrap:wrap}

  .action-btn{
    font-size:11.5px;
    padding:8px 14px;
    border-radius:9px;
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.35);
    color:#fff;
    cursor:pointer;
    font-weight:600;
    transition:all 0.18s ease;
    font-family:inherit;
    touch-action:manipulation;
    min-height:36px;
  }
  .action-btn:hover, .action-btn:active{
    background:rgba(255,255,255,0.18);
    transform:translateY(-1px);
  }
  .action-btn.primary{
    background:rgba(239,68,68,0.16);
    border-color:rgba(239,68,68,0.55);
    color:#fecaca;
  }
  .action-btn.primary:hover, .action-btn.primary:active{
    background:rgba(239,68,68,0.28);
    box-shadow:0 4px 14px rgba(239,68,68,0.28);
  }

  /* Summary pills */
  .summary-bar{
    display:flex;gap:8px;flex-wrap:wrap;
    padding:0 0 16px;
    border-bottom:1px solid rgba(255,255,255,0.10);
    margin-bottom:18px;
  }
  .summary-pill{
    padding:5px 13px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.2px;
    border:1px solid currentColor;
    background:rgba(255,255,255,0.03);
  }

  /* ============================================================
     Swipeable tabs — touch UX
     ============================================================ */
  .tab-strip{
    display:flex;
    gap:6px;
    padding:6px;
    margin-bottom:16px;
    border-radius:12px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12);
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x mandatory;
  }
  .tab-strip::-webkit-scrollbar{display:none}
  .tab-btn{
    flex-shrink:0;
    padding:9px 16px;
    border:none;
    border-radius:9px;
    background:transparent;
    color:rgba(255,255,255,0.75);
    font-size:12.5px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition:all 0.18s ease;
    min-height:38px;
    touch-action:manipulation;
    scroll-snap-align:start;
    white-space:nowrap;
  }
  .tab-btn:hover{color:#fff;background:rgba(255,255,255,0.08)}
  .tab-btn.active{
    background:rgba(255,255,255,0.16);
    color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.25);
  }

  .tab-panel{display:none;animation:fadeIn 0.25s ease}
  .tab-panel.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ============================================================
     Plotly charts grid
     ============================================================ */
  .chart-grid{
    display:grid;
    gap:16px;
  }
  @media (min-width:820px){.chart-grid{grid-template-columns:1fr 1fr}}

  .chart-box{
    padding:8px 10px 4px;
    border-radius:14px;
    background:rgba(255,255,255,0.035);
    border:1px solid rgba(255,255,255,0.13);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.12);
    height:340px;
    position:relative;
    overflow:hidden;
  }
  .chart-box > div{width:100%;height:100%;touch-action:manipulation}

  @media (max-width:700px){
    .chart-box{height:300px}
  }

  /* Hint pill for touch gestures */
  .touch-hint{
    position:absolute;
    top:12px;
    right:12px;
    font-size:10.5px;
    padding:4px 10px;
    border-radius:999px;
    background:rgba(79,70,229,0.25);
    border:1px solid rgba(139,92,246,0.55);
    color:#e9d5ff;
    font-weight:600;
    pointer-events:none;
    animation:hintFade 4s ease forwards;
    z-index:5;
  }
  @keyframes hintFade{
    0%{opacity:0;transform:translateY(-4px)}
    15%,80%{opacity:1;transform:none}
    100%{opacity:0}
  }

  /* ============================================================
     Protein list (compact)
     ============================================================ */
  .protein-list{display:grid;gap:10px}
  .protein-item{
    padding:14px 16px;
    border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.14);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    transition:background 0.18s ease, border-color 0.18s ease;
    cursor:pointer;
    text-decoration:none;
    color:inherit;
    min-height:64px;
  }
  .protein-item:hover, .protein-item:active{
    background:rgba(255,255,255,0.06);
    border-color:rgba(255,255,255,0.32);
  }
  .protein-item-info{flex:1;min-width:0}
  .protein-item h4{
    font-size:14px;
    margin-bottom:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    letter-spacing:-0.1px;
  }
  .protein-item .meta{
    font-size:11.5px;
    color:rgba(255,255,255,0.58);
    font-family:ui-monospace,SFMono-Regular,monospace;
  }
  .protein-item .tier-pills{
    display:flex;
    gap:4px;
    flex-shrink:0;
    flex-wrap:wrap;
    justify-content:flex-end;
    max-width:180px;
  }
  .tier-pill{
    font-size:9.5px;
    padding:2px 7px;
    border-radius:999px;
    font-weight:700;
    letter-spacing:0.3px;
    border:1px solid currentColor;
    background:rgba(255,255,255,0.03);
  }

  /* ============================================================
     Tree scroll container
     ============================================================ */
  .tree-scroll{
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-x pan-y;
    padding-bottom:8px;
    border-radius:12px;
    background:rgba(255,255,255,0.02);
    border:1px solid rgba(255,255,255,0.12);
  }
  .tree-loading, .tree-empty{
    font-size:12px;
    color:rgba(255,255,255,0.6);
    font-style:italic;
    padding:22px;
    text-align:center;
  }

  /* ============================================================
     Loading bar
     ============================================================ */
  .loading-bar{
    height:3px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.85),transparent);
    background-size:200% 100%;
    animation:slide 1.2s linear infinite;
    border-radius:2px;
    margin:12px 0;
  }
  @keyframes slide{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* ============================================================
     Mobile tweaks
     ============================================================ */
  @media (max-width:600px){
    .collective-card{padding:16px 16px 22px;border-radius:16px}
    .collective-header h2{font-size:18px}
    .chart-grid{gap:12px}
    .chart-box{height:280px;padding:4px 4px 0}
    .action-btn{font-size:11px;padding:7px 12px}
  }

  /* Larger tap target on iOS */
  @supports(-webkit-touch-callout:none){
    .action-btn, .tab-btn{min-height:44px}
    .protein-item{min-height:70px}
  }
</style>
</head><body>

<nav class="nav">
  <a href="index.html">Home</a>
  <a href="app.html" class="active">App</a>
  <a href="about.html">About</a>
</nav>

<main class="glass-card" style="max-width:1300px">
  <section style="padding:32px 40px 12px;">
    <h2 style="font-size:24px;margin-bottom:8px;letter-spacing:-0.3px;">Search Proteins</h2>
    <p>Collective reliability dashboard · provenance tree · PDF export.</p>
  </section>

  <div class="search-bar">
    <input id="q" type="text" placeholder="P12345 or 'kinase'"/>
    <button class="btn" id="go">Search</button>
  </div>

  <section class="results" id="out">
    <div class="glass-field result-card" style="display:block;min-width:0">
      <h4>Waiting for input…</h4>
    </div>
  </section>
</main>

<!-- Libraries -->
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<!-- Project scripts -->
<script src="assets/js/config.js?v=24"></script>
<script src="assets/js/bubbles.js?v=24"></script>
<script src="assets/js/ui.js?v=24"></script>
<script src="assets/js/api.js?v=24"></script>
<script src="assets/js/evidence.js?v=24"></script>
<script src="assets/js/retraction.js?v=24"></script>
<script src="assets/js/impact.js?v=24"></script>
<script src="assets/js/collective.js?v=24"></script>
<script src="assets/js/tree.js?v=24"></script>
<script src="assets/js/pdf.js?v=24"></script>

<script>
(function () {
  "use strict";
  var q = document.getElementById("q");
  var go = document.getElementById("go");
  var out = document.getElementById("out");
  var latestResults = [];

  function looksLikeAccession(s) {
    return /^[A-Z][A-Z0-9]{5,9}$/i.test(s) && /\d/.test(s);
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function tally(features) {
    var t = { high:0, medium:0, low:0, very_low:0, unknown:0 };
    features.forEach(function (f) {
      var c = window.Evidence.classifyFeature(f);
      t[c.tier] = (t[c.tier] || 0) + 1;
    });
    return t;
  }

  function renderCollective(proteins, retractions) {
    // aggregate tally
    var total = { high:0, medium:0, low:0, very_low:0, unknown:0 };
    var totalFeatures = 0;
    proteins.forEach(function (p) {
      var t = tally(p.features || []);
      totalFeatures += (p.features || []).length;
      Object.keys(t).forEach(function (k) { total[k] += t[k]; });
    });

    var colors = { high:"#22c55e", medium:"#eab308", low:"#f97316",
                   very_low:"#ef4444", unknown:"#9ca3af" };
    var pills = Object.keys(total).filter(function (k) { return total[k] > 0; })
      .map(function (tier) {
        return '<span class="summary-pill" style="color:' + colors[tier] + '">' +
               total[tier] + ' ' + tier + '</span>';
      }).join("");

    var queryStr = q.value.trim() || "results";

    var html = '' +
      '<div class="collective-card">' +
        '<div class="collective-header">' +
          '<div>' +
            '<h2>📊 ' + esc(queryStr) + ' — ' + proteins.length +
              ' protein' + (proteins.length !== 1 ? 's' : '') + '</h2>' +
            '<div class="meta">' + totalFeatures + ' annotated features · ' +
              'live from UniProt · ' + new Date().toLocaleTimeString() +
            '</div>' +
          '</div>' +
          '<div class="collective-actions">' +
            '<button class="action-btn primary" id="pdf-collective">📄 Export PDF</button>' +
            '<button class="action-btn" id="json-collective">⬇ JSON</button>' +
          '</div>' +
        '</div>' +
        (pills ? '<div class="summary-bar">' + pills + '</div>' : '') +

        // Tab strip
        '<div class="tab-strip" id="tabstrip">' +
          '<button class="tab-btn active" data-tab="charts">📈 Charts</button>' +
          '<button class="tab-btn" data-tab="proteins">🧬 Proteins</button>' +
          '<button class="tab-btn" data-tab="tree">🌳 Tree</button>' +
          '<button class="tab-btn" data-tab="impact">💥 Impact</button>' +
        '</div>' +

        // Tab panels
        '<div class="tab-panel active" id="tab-charts">' +
          '<div class="chart-grid">' +
            '<div class="chart-box"><div id="collective-donut"></div>' +
              '<span class="touch-hint">🤏 pinch · drag</span></div>' +
            '<div class="chart-box"><div id="collective-perprot"></div></div>' +
            '<div class="chart-box"><div id="collective-types"></div></div>' +
            '<div class="chart-box"><div id="collective-positions"></div></div>' +
          '</div>' +
        '</div>' +

        '<div class="tab-panel" id="tab-proteins">' +
          '<div class="protein-list">' +
            proteins.map(function (p) {
              var acc = p.primaryAccession;
              var name = (p.proteinDescription &&
                          p.proteinDescription.recommendedName &&
                          p.proteinDescription.recommendedName.fullName &&
                          p.proteinDescription.recommendedName.fullName.value) ||
                         p.uniProtkbId || "Unknown";
              var org = (p.organism && p.organism.scientificName) || "";
              var t = tally(p.features || []);
              var tierPills = Object.keys(t).filter(function (k) { return t[k] > 0; })
                .map(function (tier) {
                  return '<span class="tier-pill" style="color:' + colors[tier] + '">' +
                         t[tier] + ' ' + tier + '</span>';
                }).join("");
              return '<a class="protein-item" href="?q=' + esc(acc) + '">' +
                '<div class="protein-item-info">' +
                  '<h4>' + esc(name) + '</h4>' +
                  '<div class="meta">' + esc(acc) + ' · ' + esc(org) + '</div>' +
                '</div>' +
                '<div class="tier-pills">' + tierPills + '</div>' +
              '</a>';
            }).join("") +
          '</div>' +
        '</div>' +

        '<div class="tab-panel" id="tab-tree">' +
          '<div id="collective-tree"></div>' +
        '</div>' +

        '<div class="tab-panel" id="tab-impact">' +
          '<div id="collective-impact"></div>' +
        '</div>' +
      '</div>';

    return html;
  }

  function setupTabs() {
    var strip = document.getElementById('tabstrip');
    if (!strip) return;
    strip.addEventListener('click', function (e) {
      var btn = e.target.closest('.tab-btn');
      if (!btn) return;
      var target = btn.getAttribute('data-tab');

      strip.querySelectorAll('.tab-btn').forEach(function (b) {
        b.classList.toggle('active', b === btn);
      });
      document.querySelectorAll('.tab-panel').forEach(function (p) {
        p.classList.toggle('active', p.id === 'tab-' + target);
      });

      if (target === 'tree') {
        var treeBox = document.getElementById('collective-tree');
        if (treeBox && !treeBox.dataset.built && latestResults.length) {
          treeBox.dataset.built = "1";
          window.Provenance.renderForAccession(
            latestResults[0].primaryAccession, treeBox, 2);
        }
      }
      if (target === 'impact') {
        var impactBox = document.getElementById('collective-impact');
        if (impactBox && !impactBox.dataset.built && latestResults.length) {
          impactBox.dataset.built = "1";
          window.Impact.analyze(
            latestResults[0], window.Retraction._cache || {}, impactBox);
        }
      }

      // haptic on supported devices
      if (navigator.vibrate) navigator.vibrate(8);
    });
  }

  function collectAllPmids(results) {
    var set = {};
    results.forEach(function (r) {
      (r.features || []).forEach(function (f) {
        window.Retraction.extractPmids(f).forEach(function (p) { set[p] = true; });
      });
    });
    return Object.keys(set);
  }

  function run() {
    var t = q.value.trim();
    if (!t) return;
    out.innerHTML = '<div class="glass-field result-card" style="display:block;min-width:0">' +
      '<h4>Searching…</h4><div class="loading-bar"></div></div>';

    var p;
    if (looksLikeAccession(t)) {
      p = window.BioAPI.fetchProtein(t).then(function (r) { return [r]; });
    } else {
      p = window.BioAPI.searchProteins(t, 10);
    }

    p.then(function (results) {
      if (!results || !results.length) {
        out.innerHTML = '<div class="glass-field result-card" style="display:block;min-width:0"><h4>No results</h4></div>';
        return;
      }
      latestResults = results;

      out.innerHTML = '<div class="glass-field result-card" style="display:block;min-width:0">' +
        '<h4>Checking sources…</h4><div class="loading-bar"></div></div>';

      var pmids = collectAllPmids(results);
      return window.Retraction.checkPmids(pmids).then(function (retractions) {
        out.innerHTML = renderCollective(results, retractions);
        setupTabs();

        // render collective charts
        window.Collective.renderAll(results);

        // Export PDF handler
        document.getElementById('pdf-collective').addEventListener('click', function () {
          var btn = this;
          btn.disabled = true;
          btn.textContent = 'Rendering…';
          setTimeout(function () {
            try {
              // export the first protein's data with all features merged
              var merged = Object.assign({}, results[0], {
                features: results.reduce(function (acc, p) {
                  return acc.concat((p.features || []).map(function (f) {
                    f._source = p.primaryAccession;
                    return f;
                  }));
                }, [])
              });
              window.PDFExport.exportPDF(merged, retractions, null);
            } catch (e) { alert('PDF failed: ' + e.message); }
            btn.disabled = false;
            btn.textContent = '📄 Export PDF';
          }, 50);
        });

        // JSON download handler
        document.getElementById('json-collective').addEventListener('click', function () {
          var data = {
            query: t,
            generated_at: new Date().toISOString(),
            proteins: results.map(function (p) {
              return {
                accession: p.primaryAccession,
                name: (p.proteinDescription && p.proteinDescription.recommendedName &&
                       p.proteinDescription.recommendedName.fullName &&
                       p.proteinDescription.recommendedName.fullName.value) || "",
                organism: (p.organism && p.organism.scientificName) || "",
                feature_count: (p.features || []).length,
                tier_tally: tally(p.features || {})
              };
            })
          };
          var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'provenance-' + t.replace(/[^A-Za-z0-9]/g, '_') + '.json';
          a.click();
          URL.revokeObjectURL(url);
        });
      });
    }).catch(function (e) {
      console.error(e);
      out.innerHTML = '<div class="glass-field result-card" style="display:block;min-width:0">' +
        '<h4>Error: ' + esc(e.message) + '</h4></div>';
    });
  }

  var params = new URLSearchParams(window.location.search);
  if (params.get("q")) {
    q.value = params.get("q");
    setTimeout(run, 100);
  }
  go.addEventListener("click", run);
  q.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
  console.log("[app] v22 ready — collective dashboard + touch UX");
})();
</script>
</body></html>
