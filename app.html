<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Search — Provenance Tracker</title>
<link rel="icon" href="assets/img/favicon.svg"/>
<link rel="stylesheet" href="assets/css/design-system.css?v=19"/>
<link rel="stylesheet" href="assets/css/pages.css?v=19"/>
<style>
  /* =========================================================
     Card grid layout (desktop-first)
     ========================================================= */
  .result-card{
    display:grid;
    grid-template-columns: 300px 1fr;
    grid-template-areas:
      "header  header"
      "summary summary"
      "mol     charts"
      "tree    impact"
      "table   table";
    gap: 18px 22px;
    padding: 22px 24px 26px;
    border-radius: 18px;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.20);
    backdrop-filter: blur(6px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.20),
                0 8px 24px rgba(0,0,0,0.20);
    margin-bottom: 22px;
    align-items: start;
  }
  @media (max-width: 900px){
    .result-card{
      grid-template-columns: 1fr;
      grid-template-areas:
        "header" "summary" "mol" "charts" "tree" "impact" "table";
    }
  }

  .grid-header{grid-area: header}
  .grid-summary{grid-area: summary}
  .grid-mol{grid-area: mol}
  .grid-charts{grid-area: charts}
  .grid-tree{grid-area: tree}
  .grid-impact{grid-area: impact}
  .grid-table{grid-area: table}

  /* Header */
  .chain-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    flex-wrap:wrap;
    margin:0;
  }
  .chain-header h4{
    font-size:17px;
    letter-spacing:-0.2px;
    line-height:1.3;
    margin-bottom:4px;
  }
  .chain-header small{
    font-size:12px;
    color:rgba(255,255,255,0.6);
  }
  .chain-actions{display:flex;gap:8px;flex-shrink:0}

  .pdf-btn{
    font-size:11.5px;
    padding:8px 14px;
    border-radius:9px;
    background:rgba(239,68,68,0.16);
    border:1px solid rgba(239,68,68,0.55);
    color:#fecaca;
    cursor:pointer;
    font-weight:600;
    letter-spacing:0.2px;
    transition:all 0.18s ease;
    font-family:inherit;
  }
  .pdf-btn:hover{
    background:rgba(239,68,68,0.28);
    transform:translateY(-1px);
    box-shadow:0 4px 14px rgba(239,68,68,0.28);
  }
  .pdf-btn:disabled{opacity:0.5;cursor:wait;transform:none}

  /* Summary bar */
  .summary-bar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    padding:0 0 14px;
    border-bottom:1px solid rgba(255,255,255,0.10);
    margin:0;
  }
  .summary-pill{
    padding:4px 12px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.2px;
    border:1px solid currentColor;
    background:rgba(255,255,255,0.03);
  }

  /* Retraction banner */
  .retract-banner{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;
    background:rgba(239,68,68,0.14);
    border:1px solid rgba(239,68,68,0.55);
    border-left:3px solid #ef4444;
    border-radius:10px;
    font-size:12.5px;
    color:#fff;
    line-height:1.5;
    grid-column:1/-1;
  }
  .retract-banner .icon{font-size:18px;flex-shrink:0}
  .retract-banner strong{color:#fecaca}

  /* Section headers */
  .grid-section-title{
    font-size:11px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:rgba(255,255,255,0.92);
    margin-bottom:10px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .grid-section-title::before{
    content:"";
    display:inline-block;
    width:3px;
    height:13px;
    border-radius:2px;
    background:linear-gradient(180deg,#a78bfa,#ec4899);
    box-shadow:0 0 8px rgba(236,72,153,0.5);
  }

  /* 3D viewer */
  .mol-canvas{
    width:100%;
    height:340px;
    border-radius:12px;
    background:radial-gradient(circle at 50% 40%,
      rgba(99,102,241,0.10),rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.12);
    overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .mol-loading,.mol-empty{
    font-size:12px;color:rgba(255,255,255,0.65);
    padding:24px;text-align:center;font-style:italic;
  }
  .mol-meta{
    font-size:11px;
    color:rgba(255,255,255,0.6);
    margin-top:8px;
    text-align:center;
  }
  .mol-meta a{color:#fbcfe8;text-decoration:none;
              border-bottom:1px dotted rgba(251,207,232,0.4)}
  .mol-meta a:hover{border-bottom-style:solid;border-bottom-color:#fbcfe8}

  /* Plotly charts 2x2 */
  .charts-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  @media (max-width:640px){
    .charts-grid{grid-template-columns:1fr}
  }
  .chart-box{
    padding:10px 10px 4px;
    border-radius:12px;
    background:rgba(255,255,255,0.035);
    border:1px solid rgba(255,255,255,0.13);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.12);
    height:230px;
    position:relative;
    overflow:hidden;
  }
  .chart-box > div{width:100%;height:100%}

  /* Tree */
  .tree-box{
    border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.12);
    padding:12px;
    min-height:220px;
    overflow:auto;
  }
  .tree-loading,.tree-empty{
    font-size:12px;color:rgba(255,255,255,0.6);
    font-style:italic;padding:18px;text-align:center;
  }

  /* Impact */
  .impact-title{
    font-size:11px;letter-spacing:0.8px;text-transform:uppercase;
    color:#fecaca;margin-bottom:10px;font-weight:700;
    display:flex;align-items:center;gap:10px;
  }
  .impact-title::before{
    content:"";display:inline-block;width:3px;height:13px;border-radius:2px;
    background:linear-gradient(180deg,#f87171,#dc2626);
    box-shadow:0 0 8px rgba(220,38,38,0.5);
  }
  .impact-empty{font-size:12px;color:rgba(255,255,255,0.55);
                font-style:italic;padding:8px 0}
  .impact-block{
    padding:12px;border-radius:10px;margin-bottom:10px;
    background:rgba(239,68,68,0.08);
    border:1px solid rgba(239,68,68,0.4);
    border-left:3px solid #ef4444;
  }
  .impact-pmid{font-size:12px;font-weight:700;color:#fecaca;margin-bottom:4px}
  .impact-tag{background:#ef4444;color:#fff;padding:2px 7px;border-radius:4px;
              font-size:9.5px;font-weight:800;letter-spacing:0.5px;margin-right:6px}
  .impact-paper{font-size:11.5px;color:rgba(255,255,255,0.82);
                margin-bottom:8px;line-height:1.5;font-style:italic}
  .impact-count{font-size:12.5px;color:#fff;margin:8px 0}
  .impact-count strong{color:#fecaca;font-size:16px}
  .impact-protein{display:flex;gap:8px;align-items:baseline;font-size:11.5px;
                  padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
  .impact-protein a{color:#fbcfe8;text-decoration:none;font-weight:700;
                    font-family:ui-monospace,monospace;min-width:68px}
  .impact-protein small{color:rgba(255,255,255,0.45);font-style:italic;
                        font-size:10.5px;margin-left:auto}
  .impact-total{font-size:13px;color:#fff;padding:10px 0 4px;
                text-align:center;font-weight:600}
  .impact-total strong{color:#fecaca;font-size:18px}

  /* Feature table */
  .feature-table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
  }
  .feature-table th{
    text-align:left;
    padding:9px 10px;
    font-size:10.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:rgba(255,255,255,0.65);
    border-bottom:1px solid rgba(255,255,255,0.18);
    font-weight:700;
    position:sticky;
    top:0;
    background:rgba(30,27,75,0.6);
    backdrop-filter:blur(6px);
  }
  .feature-table td{
    padding:9px 10px;
    border-bottom:1px solid rgba(255,255,255,0.05);
    color:rgba(255,255,255,0.88);
    vertical-align:top;
  }
  .feature-table tr:hover td{
    background:rgba(255,255,255,0.035);
  }
  .tier-tag{
    display:inline-block;
    padding:2px 9px;
    border-radius:999px;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.4px;
    text-transform:uppercase;
    border:1px solid currentColor;
    background:rgba(255,255,255,0.04);
  }
  .retract-inline{
    display:inline-block;
    padding:1px 6px;
    border-radius:4px;
    background:#ef4444;
    color:#fff;
    font-size:9px;
    font-weight:800;
    margin-left:6px;
    vertical-align:middle;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
</style>
</head><body>

<nav class="nav">
  <a href="index.html">Home</a>
  <a href="app.html" class="active">App</a>
  <a href="about.html">About</a>
</nav>

<main class="glass-card" style="max-width:1280px">
  <section style="padding:32px 40px 12px;">
    <h2 style="font-size:24px;margin-bottom:8px;letter-spacing:-0.3px;">Search Proteins</h2>
    <p>Evidence · retractions · 3D structure · reliability charts · SVG tree · PDF.</p>
  </section>

  <div class="search-bar">
    <input id="q" type="text" placeholder="P12345 or 'kinase'"/>
    <button class="btn" id="go">Search</button>
  </div>

  <section class="results" id="out">
    <div class="glass-field result-card">
      <div class="grid-header"><h4>Waiting for input…</h4></div>
    </div>
  </section>
</main>

<!-- libraries -->
<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<!-- project scripts -->
<script src="assets/js/config.js?v=19"></script>
<script src="assets/js/bubbles.js?v=19"></script>
<script src="assets/js/ui.js?v=19"></script>
<script src="assets/js/api.js?v=19"></script>
<script src="assets/js/evidence.js?v=19"></script>
<script src="assets/js/retraction.js?v=19"></script>
<script src="assets/js/impact.js?v=19"></script>
<script src="assets/js/structure.js?v=19"></script>
<script src="assets/js/plotly-charts.js?v=19"></script>
<script src="assets/js/tree.js?v=19"></script>
<script src="assets/js/pdf.js?v=19"></script>

<script>
(function () {
  "use strict";
  var q = document.getElementById("q");
  var go = document.getElementById("go");
  var out = document.getElementById("out");
  var latestResults = [];

  function looksLikeAccession(s) {
    return /^[A-Z][A-Z0-9]{5,9}$/i.test(s) && /\d/.test(s);
  }
  function safeId(acc) { return acc.replace(/[^A-Za-z0-9]/g, "_"); }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function summarize(features) {
    var tally = { high:0, medium:0, low:0, very_low:0, unknown:0 };
    features.forEach(function (f) {
      var c = window.Evidence.classifyFeature(f);
      tally[c.tier] = (tally[c.tier] || 0) + 1;
    });
    return tally;
  }

  function renderFeatureTable(features, retractions) {
    if (!features.length) {
      return '<div class="impact-empty">No features in this record.</div>';
    }
    var rows = features.slice(0, 300).map(function (f) {
      var c = window.Evidence.classifyFeature(f);
      var pmids = window.Retraction.extractPmids(f);
      var retracted = pmids.some(function (p) {
        return retractions[p] && retractions[p].retracted;
      });
      var pos = "—";
      if (f.location && f.location.start && f.location.end) {
        pos = f.location.start.value + "–" + f.location.end.value;
      }
      var sources = (f.evidences || [])
        .map(function (e) { return e.source; })
        .filter(Boolean).slice(0, 2).join(", ") || "—";
      return '<tr>' +
        '<td>' + esc(f.type || "—") + '</td>' +
        '<td>' + esc(f.description || "—") + '</td>' +
        '<td class="mono">' + esc(pos) + '</td>' +
        '<td><span class="tier-tag" style="color:' + c.color + '">' +
          esc(c.label) + '</span>' +
          (retracted ? '<span class="retract-inline">⚠ RETRACTED</span>' : '') +
        '</td>' +
        '<td class="mono">' + esc(sources) + '</td>' +
      '</tr>';
    }).join("");

    return '<table class="feature-table">' +
      '<thead><tr>' +
        '<th>Type</th><th>Description</th><th>Position</th>' +
        '<th>Tier</th><th>Source</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function renderProtein(r, retractions) {
    var acc = r.primaryAccession || "";
    var sid = safeId(acc);
    var name = (r.proteinDescription &&
                r.proteinDescription.recommendedName &&
                r.proteinDescription.recommendedName.fullName &&
                r.proteinDescription.recommendedName.fullName.value) ||
               r.uniProtkbId || "Unknown";
    var org = (r.organism && r.organism.scientificName) || "";
    var features = (r.features || []).slice(0, 300);
    var tally = summarize(features);
    var colors = { high:"#22c55e", medium:"#eab308", low:"#f97316",
                   very_low:"#ef4444", unknown:"#9ca3af" };
    var pills = Object.keys(tally).filter(function (k) { return tally[k] > 0; })
      .map(function (tier) {
        return '<span class="summary-pill" style="color:' + colors[tier] + '">' +
               tally[tier] + ' ' + tier + '</span>';
      }).join("");

    var retractedCount = 0;
    features.forEach(function (f) {
      var pmids = window.Retraction.extractPmids(f);
      if (pmids.some(function (p) {
        return retractions[p] && retractions[p].retracted;
      })) retractedCount++;
    });
    var banner = retractedCount > 0
      ? '<div class="retract-banner"><span class="icon">⚠️</span>' +
        '<div><strong>' + retractedCount + ' annotation' +
        (retractedCount > 1 ? 's' : '') +
        '</strong> rely on retracted papers.</div></div>'
      : "";

    return (
      '<div class="result-card" id="card-' + sid + '" data-acc="' + acc + '">' +
        '<div class="grid-header"><div class="chain-header">' +
          '<div><h4>' + esc(name) + '</h4><small>' +
            esc(acc) + ' · ' + esc(org) + '</small></div>' +
          '<div class="chain-actions">' +
            '<button class="pdf-btn" data-acc="' + acc + '">📄 Export PDF</button>' +
          '</div>' +
        '</div></div>' +

        '<div class="grid-summary">' +
          (banner || '') +
          (pills ? '<div class="summary-bar">' + pills + '</div>' : '') +
        '</div>' +

        '<div class="grid-mol">' +
          '<div class="grid-section-title">🧬 3D Structure</div>' +
          '<div id="mol-' + sid + '"></div>' +
        '</div>' +

        '<div class="grid-charts">' +
          '<div class="grid-section-title">📊 Reliability Charts</div>' +
          '<div class="charts-grid">' +
            '<div class="chart-box"><div id="chart-' + sid + '-donut"></div></div>' +
            '<div class="chart-box"><div id="chart-' + sid + '-features"></div></div>' +
            '<div class="chart-box"><div id="chart-' + sid + '-scatter"></div></div>' +
            '<div class="chart-box"><div id="chart-' + sid + '-timeline"></div></div>' +
          '</div>' +
        '</div>' +

        '<div class="grid-tree">' +
          '<div class="grid-section-title">🌳 Provenance Tree</div>' +
          '<div class="tree-box" id="tree-' + sid + '"></div>' +
        '</div>' +

        '<div class="grid-impact">' +
          '<div id="impact-' + sid + '"></div>' +
        '</div>' +

        '<div class="grid-table">' +
          '<div class="grid-section-title">📋 Feature Table</div>' +
          renderFeatureTable(features, retractions) +
        '</div>' +
      '</div>'
    );
  }

  function collectAllPmids(results) {
    var set = {};
    results.forEach(function (r) {
      (r.features || []).forEach(function (f) {
        window.Retraction.extractPmids(f).forEach(function (p) { set[p] = true; });
      });
    });
    return Object.keys(set);
  }

  function run() {
    var t = q.value.trim();
    if (!t) return;
    out.innerHTML = '<div class="glass-field result-card" style="display:block">' +
                    '<h4>Searching…</h4>' +
                    '<div class="loading-bar" style="height:2px"></div></div>';
    var p;
    if (looksLikeAccession(t)) {
      p = window.BioAPI.fetchProtein(t).then(function (r) { return [r]; });
    } else {
      p = window.BioAPI.searchProteins(t, 5);
    }
    p.then(function (results) {
      if (!results || !results.length) {
        out.innerHTML = '<div class="glass-field result-card" style="display:block">' +
                        '<h4>No results</h4></div>';
        return;
      }
      latestResults = results;
      out.innerHTML = '<div class="glass-field result-card" style="display:block">' +
                      '<h4>Checking sources…</h4>' +
                      '<div class="loading-bar" style="height:2px"></div></div>';
      var pmids = collectAllPmids(results);
      return window.Retraction.checkPmids(pmids).then(function (retractions) {
        out.innerHTML = results.map(function (r) {
          return renderProtein(r, retractions);
        }).join("");

        // Render sub-components
        results.forEach(function (r) {
          var acc = r.primaryAccession || "";
          var sid = safeId(acc);
          var features = (r.features || []).slice(0, 300);

          var molBox = document.getElementById("mol-" + sid);
          if (molBox && window.Structure) window.Structure.render(acc, molBox);

          if (window.ReliabilityCharts) {
            var prefix = "chart-" + sid;
            if (document.getElementById(prefix + "-donut")) {
              window.ReliabilityCharts.renderAll(prefix, features, retractions);
            }
          }

          var treeBox = document.getElementById("tree-" + sid);
          if (treeBox && window.Provenance) {
            window.Provenance.renderForAccession(acc, treeBox, 2);
          }

          var impactBox = document.getElementById("impact-" + sid);
          if (impactBox && window.Impact) {
            window.Impact.analyze(r, retractions, impactBox);
          }
        });
      });
    }).catch(function (e) {
      console.error(e);
      out.innerHTML = '<div class="glass-field result-card" style="display:block">' +
                      '<h4>Error: ' + esc(e.message) + '</h4></div>';
    });
  }

  document.addEventListener("click", function (e) {
    var btn = e.target.closest(".pdf-btn");
    if (!btn) return;
    var card = btn.closest(".result-card");
    if (!card) return;
    var acc = card.getAttribute("data-acc");
    var found = latestResults.find(function (r) {
      return r.primaryAccession === acc;
    });
    if (!found) return;
    btn.disabled = true;
    btn.textContent = "Rendering…";
    setTimeout(function () {
      try {
        window.PDFExport.exportPDF(found, window.Retraction._cache || {});
      } catch (err) {
        alert("PDF failed: " + err.message);
      }
      btn.disabled = false;
      btn.textContent = "📄 Export PDF";
    }, 50);
  });

  var params = new URLSearchParams(window.location.search);
  if (params.get("q")) {
    q.value = params.get("q");
    setTimeout(run, 100);
  }
  go.addEventListener("click", run);
  q.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
  console.log("[app] v19 ready — desktop grid + Plotly + PDF + SVG tree");
})();
</script>
</body></html>
