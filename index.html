<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>BioOrigin — Biological Annotation Lineage</title>
<link rel="icon" href="assets/img/favicon.svg"/>
<link rel="stylesheet" href="assets/css/design-system.css?v=40"/>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 60px 20px;
    text-align: center;
    overflow-x: hidden;
  }

  /* ===== Logo (rotating DNA helix) ===== */
  .logo-wrap {
    position: relative;
    width: 150px; height: 150px;
    perspective: 1000px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 42px;
  }
  .logo-glow {
    position: absolute;
    inset: -12%;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      #a78bfa, #f472b6, #60a5fa, #34d399, #a78bfa);
    filter: blur(30px);
    opacity: 0.7;
    animation: glowSpin 8s linear infinite, glowPulse 3.5s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes glowSpin { to { transform: rotate(360deg); } }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.55; transform: scale(1)    rotate(0deg); }
    50%      { opacity: 0.90; transform: scale(1.10) rotate(180deg); }
  }
  .logo-3d {
    position: relative;
    width: 110px; height: 110px;
    transform-style: preserve-3d;
    animation: spinY 8s linear infinite;
    z-index: 1;
    filter: drop-shadow(0 6px 24px rgba(139,92,246,0.55));
  }
  @keyframes spinY {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }
  .logo-3d svg { width: 100%; height: 100%; display: block; }
  .logo-wrap::after {
    content: "";
    position: absolute;
    bottom: -20px; left: 50%;
    transform: translateX(-50%);
    width: 62%; height: 12px;
    border-radius: 50%;
    background: radial-gradient(ellipse,
      rgba(167,139,250,0.60), transparent 70%);
    filter: blur(9px);
    animation: shadowPulse 8s ease-in-out infinite;
  }
  @keyframes shadowPulse {
    0%, 100% { opacity: 0.70; transform: translateX(-50%) scaleX(1); }
    50%      { opacity: 0.35; transform: translateX(-50%) scaleX(0.72); }
  }

  /* ===== BioOrigin — flashy glassy 3D letters ===== */
  .brand-title {
    position: relative;
    font-size: 68px;
    font-weight: 900;
    letter-spacing: -2.5px;
    line-height: 1.1;
    margin-bottom: 24px;
    font-family: 'Segoe UI', 'SF Pro Display', system-ui, sans-serif;
    /* Base gradient — animated rainbow sheen */
    background: linear-gradient(
      95deg,
      #ffffff 0%,
      #e9d5ff 12%,
      #f0abfc 24%,
      #a5b4fc 38%,
      #67e8f9 52%,
      #86efac 66%,
      #fde68a 80%,
      #ffffff 100%
    );
    background-size: 350% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: gradientSlide 6s linear infinite;
    /* 3D depth via layered text shadows */
    text-shadow:
      0 1px 0 rgba(255,255,255,0.35),
      0 2px 0 rgba(190,180,255,0.45),
      0 3px 0 rgba(160,140,255,0.4),
      0 4px 0 rgba(140,120,255,0.35),
      0 5px 0 rgba(120,100,255,0.3),
      0 6px 0 rgba(100,80,255,0.25),
      0 10px 24px rgba(120,80,255,0.55),
      0 18px 46px rgba(236,72,153,0.35);
    filter: drop-shadow(0 0 24px rgba(167,139,250,0.55));
  }
  @keyframes gradientSlide {
    0%   { background-position: 0% 50%; }
    100% { background-position: 350% 50%; }
  }
  /* glass overlay on the letters for shine */
  .brand-title::after {
    content: "BioOrigin";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(255,255,255,0.55) 0%,
      rgba(255,255,255,0) 45%,
      rgba(255,255,255,0) 55%,
      rgba(255,255,255,0.25) 100%
    );
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    pointer-events: none;
    animation: glassSheen 4s ease-in-out infinite;
  }
  @keyframes glassSheen {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 0.95; }
  }

  .brand-subtitle {
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    font-weight: 600;
    margin-bottom: 22px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.45);
  }

  .brand-tagline {
    font-size: 16.5px;
    color: rgba(255,255,255,0.80);
    font-weight: 400;
    letter-spacing: 0.2px;
    max-width: 580px;
    line-height: 1.6;
    margin-bottom: 40px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.45);
  }

  .brand-actions {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .brand-actions .btn-alt {
    display: inline-block;
    padding: 14px 28px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 14px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s ease;
    font-family: inherit;
    min-height: 48px;
    touch-action: manipulation;
  }
  .brand-actions .btn-alt:hover,
  .brand-actions .btn-alt:active {
    background: rgba(255,255,255,0.18);
    transform: translateY(-2px);
  }

  .brand-credit {
    margin-top: 48px;
    font-size: 11px;
    color: rgba(255,255,255,0.42);
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  @media (max-width: 600px) {
    body { padding: 44px 18px; }
    .brand-title { font-size: 44px; letter-spacing: -1.5px; }
    .brand-tagline { font-size: 15px; }
    .brand-subtitle { font-size: 12px; letter-spacing: 2px; }
    .logo-wrap { width: 120px; height: 120px; margin-bottom: 34px; }
    .logo-3d { width: 86px; height: 86px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo-3d, .logo-glow, .logo-wrap::after,
    .brand-title, .brand-title::after { animation: none; }
  }
</style>
</head>
<body>

<div class="logo-wrap">
  <div class="logo-glow"></div>
  <div class="logo-3d">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="helixGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#a78bfa">
            <animate attributeName="stop-color"
                     values="#a78bfa;#f472b6;#60a5fa;#34d399;#a78bfa"
                     dur="6s" repeatCount="indefinite"/>
          </stop>
          <stop offset="100%" stop-color="#ec4899">
            <animate attributeName="stop-color"
                     values="#ec4899;#60a5fa;#34d399;#a78bfa;#ec4899"
                     dur="6s" repeatCount="indefinite"/>
          </stop>
        </linearGradient>
      </defs>
      <path d="M 30 15 Q 70 30 30 50 Q -10 70 30 85"
            stroke="url(#helixGrad)" stroke-width="6"
            fill="none" stroke-linecap="round"/>
      <path d="M 70 15 Q 30 30 70 50 Q 110 70 70 85"
            stroke="url(#helixGrad)" stroke-width="6"
            fill="none" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="70" y2="30"
            stroke="url(#helixGrad)" stroke-width="2.5" opacity="0.75"/>
      <line x1="30" y1="50" x2="70" y2="50"
            stroke="url(#helixGrad)" stroke-width="2.5" opacity="0.75"/>
      <line x1="30" y1="70" x2="70" y2="70"
            stroke="url(#helixGrad)" stroke-width="2.5" opacity="0.75"/>
    </svg>
  </div>
</div>

<h1 class="brand-title">BioOrigin</h1>
<div class="brand-subtitle">Provenance Tracker</div>
<p class="brand-tagline">
  Trace the origin of every biological annotation.
  Detect retracted sources. Measure error propagation.
</p>

<div class="brand-actions">
  <a class="btn" href="app.html">Open App</a>
  <a class="btn-alt" href="about.html">Read the Paper</a>
</div>

<div class="brand-credit">UniProt · NCBI · Crossref · GitHub Pages</div>

<script src="assets/js/bubbles.js?v=40"></script>

</body>
</html>
