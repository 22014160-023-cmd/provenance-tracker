<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Provenance Tracker — Biological Annotation Lineage</title>
<link rel="icon" href="assets/img/favicon.svg"/>
<link rel="stylesheet" href="assets/css/design-system.css?v=24"/>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 60px 20px;
    text-align: center;
  }

  /* ===== Animated logo block ===== */
  .logo-wrap {
    position: relative;
    width: 150px; height: 150px;
    perspective: 1000px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 38px;
  }
  .logo-glow {
    position: absolute;
    inset: -12%;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      #a78bfa, #f472b6, #60a5fa, #34d399, #a78bfa);
    filter: blur(30px);
    opacity: 0.7;
    animation: glowSpin 8s linear infinite, glowPulse 3.5s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes glowSpin { to { transform: rotate(360deg); } }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.55; transform: scale(1)    rotate(0deg); }
    50%      { opacity: 0.90; transform: scale(1.10) rotate(180deg); }
  }

  .logo-3d {
    position: relative;
    width: 110px; height: 110px;
    transform-style: preserve-3d;
    animation: spinY 8s linear infinite;
    z-index: 1;
    filter: drop-shadow(0 6px 24px rgba(139,92,246,0.55));
  }
  @keyframes spinY {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }
  .logo-3d svg { width: 100%; height: 100%; display: block; }

  /* Floor reflection */
  .logo-wrap::after {
    content: "";
    position: absolute;
    bottom: -20px; left: 50%;
    transform: translateX(-50%);
    width: 62%; height: 12px;
    border-radius: 50%;
    background: radial-gradient(ellipse,
      rgba(167,139,250,0.60), transparent 70%);
    filter: blur(9px);
    animation: shadowPulse 8s ease-in-out infinite;
  }
  @keyframes shadowPulse {
    0%, 100% { opacity: 0.70; transform: translateX(-50%) scaleX(1); }
    50%      { opacity: 0.35; transform: translateX(-50%) scaleX(0.72); }
  }

  /* ===== Brand title — flashing gradient text ===== */
  .brand-title {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: -1.4px;
    line-height: 1.08;
    margin-bottom: 18px;
    background: linear-gradient(90deg,
      #a78bfa 0%,
      #f472b6 25%,
      #60a5fa 50%,
      #34d399 75%,
      #a78bfa 100%);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: gradientSlide 9s linear infinite;
    text-shadow: 0 4px 30px rgba(167,139,250,0.35);
  }
  @keyframes gradientSlide {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .brand-tagline {
    font-size: 16px;
    color: rgba(255,255,255,0.78);
    font-weight: 400;
    letter-spacing: 0.2px;
    max-width: 560px;
    line-height: 1.6;
    margin-bottom: 36px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.45);
  }

  .brand-actions {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .brand-actions .btn-alt {
    display: inline-block;
    padding: 14px 28px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 14px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s ease;
    font-family: inherit;
    min-height: 48px;
    touch-action: manipulation;
  }
  .brand-actions .btn-alt:hover,
  .brand-actions .btn-alt:active {
    background: rgba(255,255,255,0.18);
    transform: translateY(-2px);
  }

  /* Small attribution line */
  .brand-credit {
    margin-top: 44px;
    font-size: 11px;
    color: rgba(255,255,255,0.42);
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  @media (max-width: 600px) {
    body { padding: 44px 18px; }
    .brand-title { font-size: 34px; letter-spacing: -1px; }
    .brand-tagline { font-size: 14.5px; }
    .logo-wrap { width: 120px; height: 120px; margin-bottom: 30px; }
    .logo-3d { width: 86px; height: 86px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo-3d, .logo-glow, .logo-wrap::after, .brand-title { animation: none; }
  }
</style>
</head>
<body>

<div class="logo-wrap">
  <div class="logo-glow"></div>
  <div class="logo-3d">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="helixGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#a78bfa">
            <animate attributeName="stop-color"
                     values="#a78bfa;#f472b6;#60a5fa;#34d399;#a78bfa"
                     dur="6s" repeatCount="indefinite"/>
          </stop>
          <stop offset="100%" stop-color="#ec4899">
            <animate attributeName="stop-color"
                     values="#ec4899;#60a5fa;#34d399;#a78bfa;#ec4899"
                     dur="6s" repeatCount="indefinite"/>
          </stop>
        </linearGradient>
      </defs>
      <path d="M 30 15 Q 70 30 30 50 Q -10 70 30 85"
            stroke="url(#helixGrad)" stroke-width="6"
            fill="none" stroke-linecap="round"/>
      <path d="M 70 15 Q 30 30 70 50 Q 110 70 70 85"
            stroke="url(#helixGrad)" stroke-width="6"
            fill="none" stroke-linecap="round"/>
      <line x1="30" y1="30" x2="70" y2="30"
            stroke="url(#helixGrad)" stroke-width="2.5" opacity="0.75"/>
      <line x1="30" y1="50" x2="70" y2="50"
            stroke="url(#helixGrad)" stroke-width="2.5" opacity="0.75"/>
      <line x1="30" y1="70" x2="70" y2="70"
            stroke="url(#helixGrad)" stroke-width="2.5" opacity="0.75"/>
    </svg>
  </div>
</div>

<h1 class="brand-title">Provenance Tracker</h1>
<p class="brand-tagline">
  Trace the origin of every biological annotation.
  Detect retracted sources. Measure error propagation.
</p>

<div class="brand-actions">
  <a class="btn" href="app.html">Open App</a>
  <a class="btn-alt" href="about.html">Read the Paper</a>
</div>

<div class="brand-credit">UniProt · NCBI · Crossref · GitHub Pages</div>

<script src="assets/js/bubbles.js?v=24"></script>

</body>
</html>
